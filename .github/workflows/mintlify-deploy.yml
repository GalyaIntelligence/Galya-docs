name: Mintlify Deploy

on:
  workflow_dispatch:
    inputs:
      docs_tag:
        description: "Speakeasy registry tag (dev or latest)"
        required: true
        default: latest
        type: string
      git_ref:
        description: "Branch to commit pulled OpenAPI on"
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Pull Speakeasy combined spec and deploy Mintlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref_name }}

      - name: Install Speakeasy CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | sh
          echo "$HOME/.speakeasy/bin" >> "$GITHUB_PATH"

      - name: Pull combined OpenAPI from Speakeasy registry
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p openapi
          speakeasy pull \
            --spec=galya-api-with-code-samples \
            --revision="${{ inputs.docs_tag }}" \
            --output-dir=openapi
          if [ ! -f openapi/openapi.yaml ] && [ -f openapi/openapi.json ]; then
            echo "Speakeasy returned openapi.json only"
          fi
          test -f openapi/openapi.yaml || test -f openapi/openapi.json
          chmod +x scripts/validate-mintlify-speakeasy-openapi.sh
          ./scripts/validate-mintlify-speakeasy-openapi.sh

      - name: Commit Speakeasy-generated OpenAPI
        run: |
          if git diff --quiet openapi docs.json; then
            echo "No OpenAPI changes from Speakeasy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi docs.json
          git commit -m "docs(mintlify): pull Speakeasy combined spec @${{ inputs.docs_tag }}"
          git push

      - name: Resolve Mintlify project
        id: mint
        env:
          DOCS_TAG: ${{ inputs.docs_tag }}
        run: |
          if [ "$DOCS_TAG" = "dev" ]; then
            echo "project_id=${{ vars.MINTLIFY_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.MINTLIFY_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Mintlify deployment
        if: steps.mint.outputs.project_id != ''
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          PROJECT_ID: ${{ steps.mint.outputs.project_id }}
        run: |
          curl -fsS -X POST "https://api.mintlify.com/v1/project/update/${PROJECT_ID}" \
            -H "Authorization: Bearer ${MINTLIFY_API_KEY}"

      - name: Mintlify project not configured
        if: steps.mint.outputs.project_id == ''
        run: echo "Set MINTLIFY_PROJECT_ID_* variables and MINTLIFY_API_KEY on Galya-docs."

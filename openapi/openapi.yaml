openapi: 3.1.0
info:
  title: Galya API
  version: 0.1.0
  description: 'Index a catalog, link taste, and query it.


    Workspace data routes accept a workspace secret (`galya_sk_...`) or an account key

    (`galya_ak_...`) plus `X-Galya-Workspace-Id`, via `X-API-Key` or `Authorization: Bearer`.

    '
servers:
- url: https://dev.api.galya.io
  description: Development API
tags:
- name: core
  description: Entity index, read, and link operations
- name: connectors
  description: Native connector registry and workspace connections
- name: agentic-search
  description: Expose the graph to outside agents under a workspace policy
paths:
  /v1/index:
    post:
      tags:
      - core
      operationId: indexEntity
      summary: Index one content (text, image, …) and write its vectors
      description: "Contents and entities are separate records. A content is one indexed artifact\nand\
        \ carries the vectors; an entity is the thing you recommend, score and traverse.\nMany contents\
        \ link to one entity (a product with three photos and a description);\nthe entity's vector is\
        \ composed from its contents at read time.\n\nBody shapes:\n- `content_id` (+ optional `entity_id`):\
        \ write this content. `entity_id` names the\n  entity it represents and must already exist (`404\
        \ entity_not_found` otherwise).\n  Without `entity_id` the content stays unattached: searchable,\
        \ never a candidate.\n- `entity_id` alone (no `content_id`): the one-record shortcut. Upserts\
        \ the entity\n  (`type`, `name`, `metadata`) and writes a same-id content linked to it. This is\
        \ the\n  pre-split body shape, so existing callers keep working.\n- neither: an unattached content\
        \ with a generated `cnt_…` id.\n\n`model_id` may be an encoder, or a predictor/decoder whose policy\
        \ names an encoder.\nWhen `model_id` is omitted, the content is written into every active encoder\
        \ the\nregistry would use for its domain. Omitted fields on an existing content are kept.\nUse\
        \ `POST /v1/entity` to create entities on purpose, and\n`POST /v1/entity/{entityId}/contents`\
        \ to attach contents indexed earlier.\n"
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexEntityRequest'
      responses:
        '201':
          description: Entity upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexEntityResponse'
        '400':
          description: Invalid JSON or embedding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
      - lang: typescript
        label: indexEntity
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.indexEntity({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    body: {\n      metadata: {\n\
          \        readout: {\n          \"color\": {\n            \"Black\": 0.8,\n            \"Grey\"\
          : 0.2,\n          },\n          \"product_family\": \"Dress\",\n          \"pattern\": [\n \
          \           {\n              o: \"Solid\",\n              p: 0.9,\n            },\n        \
          \    {\n              o: \"Stripe\",\n              p: 0.1,\n            },\n          ],\n\
          \        },\n      },\n    },\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Index one content (text, image, ...) and write its vectors. Contents and entities
            are separate records. A content is one indexed artifact and carries the...
          noindex: true
  /v1/entity:
    post:
      tags:
      - core
      operationId: upsertEntity
      summary: Upsert an entity (identity only, no vectors)
      description: 'Writes `entity_id`, `type`, `domain`, `name`, `metadata`. Nothing is embedded.

        Index contents with `POST /v1/index` (`content_id` + `entity_id`) and they compose

        the entity''s vector at read time. `model_id` may be passed to imply `domain` from a

        domain-scoped model.


        Compatibility: when the body also carries content fields (`content`, `embedding`,

        `source_url`, `image_url`, …) this behaves like the `/v1/index` shortcut and writes

        a same-id content too, exactly as before the split.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexEntityRequest'
      responses:
        '201':
          description: Entity upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexEntityResponse'
        '400':
          description: Invalid JSON or embedding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
      - lang: typescript
        label: upsertEntity
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.upsertEntity({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    body: {\n      metadata: {\n\
          \        readout: {\n          \"color\": {\n            \"Black\": 0.8,\n            \"Grey\"\
          : 0.2,\n          },\n          \"product_family\": \"Dress\",\n          \"pattern\": [\n \
          \           {\n              o: \"Solid\",\n              p: 0.9,\n            },\n        \
          \    {\n              o: \"Stripe\",\n              p: 0.1,\n            },\n          ],\n\
          \        },\n      },\n    },\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Upsert an entity (identity only, no vectors). Writes entityid, type, domain, name,
            metadata. Nothing is embedded. Index contents with POST /v1/index...
          noindex: true
  /v1/entities/types:
    get:
      tags:
      - core
      operationId: listEntityTypes
      summary: List entity types used in this workspace
      description: 'Distinct types recorded when entities are created or their type changes

        (`product`, `user`, and any later type). Backfilled from existing entities.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      responses:
        '200':
          description: Entity types for the authenticated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypesResponse'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
      - lang: typescript
        label: listEntityTypes
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.listEntityTypes({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  });\n\n  console.log(result);\n}\n\n\
          run();"
      x-mint:
        metadata:
          description: List entity types used in this workspace. Distinct types recorded when entities
            are created or their type changes (product, user, and any later type)....
          noindex: true
  /v1/entity/{entityId}:
    get:
      tags:
      - core
      operationId: getEntity
      summary: Get an entity by public id
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - $ref: '#/components/parameters/EntityIdPath'
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySingleResponse'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
      - lang: typescript
        label: getEntity
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.getEntity({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    entityId: \"<id>\",\n  });\n\
          \n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Get an entity by public id. GET /v1/entity/{entityId} in the Galya API reference.
          noindex: true
  /v1/entity/{entityId}/contents:
    get:
      tags:
      - core
      operationId: listEntityContents
      summary: Contents linked to an entity
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - $ref: '#/components/parameters/EntityIdPath'
      responses:
        '200':
          description: Contents that represent this entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityContentsResponse'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
      - lang: typescript
        label: listEntityContents
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.listEntityContents({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    entityId: \"<id>\",\n  });\n\
          \n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Contents linked to an entity. GET /v1/entity/{entityId}/contents in the Galya API
            reference.
          noindex: true
    post:
      tags:
      - core
      operationId: attachContents
      summary: Attach existing contents to an entity
      description: 'Links contents indexed earlier (or attached to another entity) to this entity and

        retags their stored vectors in place, so the entity''s composed vector picks them up

        without re-encoding. Optional `role` and `weight` apply to every content in the call.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - $ref: '#/components/parameters/EntityIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachContentsRequest'
      responses:
        '200':
          description: Contents attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachContentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          description: Entity, or every named content, not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      x-codeSamples:
      - lang: typescript
        label: attachContents
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.attachContents({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    entityId: \"<id>\",\n    body:\
          \ {},\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Attach existing contents to an entity. Links contents indexed earlier (or attached
            to another entity) to this entity and retags their stored vectors in...
          noindex: true
  /v1/entity/{entityId}/contents/{contentId}:
    delete:
      tags:
      - core
      operationId: detachContent
      summary: Detach a content from an entity
      description: The content stays indexed but unattached; its vectors are retagged with no owner.
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - $ref: '#/components/parameters/EntityIdPath'
      - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '200':
          description: Content detached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachContentResponse'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
      - lang: typescript
        label: detachContent
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.detachContent({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    entityId: \"<id>\",\n    contentId:\
          \ \"<id>\",\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Detach a content from an entity. The content stays indexed but unattached; its
            vectors are retagged with no owner. DELETE...
          noindex: true
  /v1/entity/{parentId}/link:
    post:
      tags:
      - core
      operationId: linkEntity
      summary: Link a child entity to a parent and refresh user state
      description: 'Creates the parent user entity if missing. Requires the child entity to exist.

        Does not re-encode the child. Recomposes the parent''s state vector from its

        linked children using the latent model (`model_id`, a decoder). When `model_id`

        is omitted, the workspace compose default is used, falling back to weighted-mean-v1.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - name: parentId
        in: path
        required: true
        schema:
          type: string
        description: Parent entity public id (often a user id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkEntityRequest'
      responses:
        '200':
          description: Link recorded and state composition attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          description: Child entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      x-codeSamples:
      - lang: typescript
        label: linkEntity
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.linkEntity({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    parentId: \"<id>\",\n    body:\
          \ {\n      metadata: {\n        dwell_ms: 8200,\n        duration_s: 21,\n        at: 1793340000000,\n\
          \      },\n    },\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Link a child entity to a parent and refresh user state. Creates the parent user
            entity if missing. Requires the child entity to exist. Does not re-encode...
          noindex: true
  /v1/entity/{parentId}/link/{childId}:
    delete:
      tags:
      - core
      operationId: unlinkEntity
      summary: Remove a child link from a parent and refresh user state
      description: 'Deletes the parent→child link. With `relation`, only that relation is removed;

        otherwise every relation between the two entities is removed. The parent''s state

        vector is then recomposed from its remaining links using the latent model

        (`model_id`, a decoder; defaults as for `linkEntity`). When no links remain, the

        parent''s state vectors are deleted from every vector index and `state.status` is

        `cleared`. Neither entity is deleted.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - name: parentId
        in: path
        required: true
        schema:
          type: string
        description: Parent entity public id (often a user id)
      - name: childId
        in: path
        required: true
        schema:
          type: string
        description: Linked child entity public id
      - name: relation
        in: query
        required: false
        schema:
          type: string
        description: Only remove this relation. Omit to remove all relations.
      - name: model_id
        in: query
        required: false
        schema:
          type: string
        description: Decoder used to recompose the parent state
      - name: encoder_model_id
        in: query
        required: false
        schema:
          type: string
        description: Encoder index to write the recomposed state into
      responses:
        '200':
          description: Link removed and state recomposed (or cleared)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlinkEntityResponse'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
        '404':
          description: Parent, child, latent model, or link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      x-codeSamples:
      - lang: typescript
        label: unlinkEntity
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.unlinkEntity({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    parentId: \"<id>\",\n    childId:\
          \ \"<id>\",\n  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Remove a child link from a parent and refresh user state. Deletes the parent→child
            link. With relation, only that relation is removed; otherwise every...
          noindex: true
  /v1/connectors/registry:

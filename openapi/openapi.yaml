components:
  securitySchemes:
    WorkspaceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    WorkspaceBearer:
      type: http
      scheme: bearer
      description: Workspace API key (`galya_sk_...`) as Bearer token
    AgentKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Search-only agent key (`galya_ag_...`); valid on /v1/agentic-search/search and /manifest
        only
  parameters:
    ContentIdPath:
      name: contentId
      in: path
      required: true
      schema:
        type: string
    EntityIdPath:
      name: entityId
      in: path
      required: true
      schema:
        type: string
    OptionalWorkspaceHeader:
      name: X-Galya-Workspace-Id
      in: header
      required: false
      schema:
        type: string
      description: Must match the workspace that owns the API key when set
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    MissingOrInvalidApiKey:
      description: Missing or invalid workspace API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    WorkspaceMismatch:
      description: X-Galya-Workspace-Id does not match the key's workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: workspace_mismatch
            message: API key does not belong to this workspace
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
        user_id:
          type: string
        domain:
          type: string
        model_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        include:
          type: array
          items:
            type: string
            enum:
            - metadata
            - contents
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
      anyOf:
      - required:
        - query
      - required:
        - user_id
    RecommendRequest:
      type: object
      additionalProperties: false
      required:
      - user_id
      properties:
        user_id:
          type: string
        domain:
          type: string
        type:
          type: string
          default: content
        model_id:
          type: string
          description: Defaults to the workspace's `default_model_id`, else `cosine-rank-v1`.
        include:
          type: array
          items:
            type: string
            enum:
            - metadata
            - contents
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    RerankRequest:
      type: object
      additionalProperties: false
      required:
      - user_id
      - candidate_ids
      properties:
        user_id:
          type: string
        candidate_ids:
          type: array
          minItems: 1
          items:
            type: string
        model_id:
          type: string
          description: 'Defaults to the workspace''s `default_model_id`, else `cosine-rank-v1`.

            `hm-user-state-v1` ranks by entity readouts against a looked-up user state, no vectors

            (see the operation description).

            '
        include:
          type: array
          items:
            type: string
            enum:
            - metadata
            - contents
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
    RerankResponse:
      type: object
      additionalProperties: true
      properties:
        compiled:
          type: object
          additionalProperties: true
        results:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
            - entity_id
            - score
            properties:
              entity_id:
                type: string
              score:
                type: number
              name:
                type:
                - string
                - 'null'
              type:
                type: string
              base:
                type: number
                description: Readout-state only. Score before the same-product penalty.
              penalty:
                type: number
                description: Readout-state only. Same-product penalty subtracted.
              contributions:
                type: array
                description: Readout-state only. Top per-field terms of the score.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    option:
                      type: string
                    lift:
                      type: number
              reason:
                type: string
                description: 'Readout-state only, e.g. `↑ matches liked: Black, Dress`, `↓ less of: Stripe`,
                  `exploring (cold start)`.'
              metadata:
                description: 'With `include: [metadata]`.'
              contents:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: 'With `include: [contents]`.'
        explain:
          type: object
          additionalProperties: true
          description: '`model_id`, `ranked_by` (`readout_loglik` for readout-state models), and for those
            also

            `state_source`, `state_error`, `state_fields` (fields the model state covered),

            `signals`, `readout_source` (`turbopuffer` / `metadata` counts) and

            `dropped: { not_found, no_readout }`.

            '
        meta:
          type: object
          additionalProperties: true
          properties:
            latency_ms:
              type: number
            state_source:
              type: string
              enum:
              - model
              - cache
              - fallback
              - pooled
              description: 'Readout-state only. `model`: fresh from the model server; `cache`: stored
                state for the

                same positive interactions; `fallback`: the lookup failed (timeout, error, not

                configured) and the pooled formula ranked; `pooled`: no positive signal yet.

                '
    EntityReadout:
      description: 'Convention for entity `metadata.readout` (set with `POST /v1/entity` or `/v1/index`),
        read by

        readout-state rankers. One entry per field id (schema v3 field ids/options, e.g. `color`,

        `product_family`); each entry is one option, a `{option: p}` distribution (normalised on

        read), or a `[{o, p}]` list. The dashboard''s `{fields: [{id, top: [{o, p}]}]}` form is

        accepted too. Add `metadata.parent_asin` (or `product_id`) for the same-product penalty and

        `metadata.duration_s` for relative dwell. Written to the keyword row as attributes

        on index and by the `text_index` backfill job.

        '
      oneOf:
      - type: object
        additionalProperties:
          oneOf:
          - type: string
          - type: object
            additionalProperties:
              type: number
              minimum: 0
          - type: array
            items:
              type: object
              properties:
                o:
                  type: string
                p:
                  type: number
      - type: object
        required:
        - fields
        properties:
          fields:
            type: array
            items:
              type: object
              required:
              - id
              - top
              properties:
                id:
                  type: string
                block:
                  type: string
                top:
                  type: array
                  items:
                    type: object
                    properties:
                      o:
                        type: string
                      p:
                        type: number
      example:
        color:
          Black: 0.8
          Grey: 0.2
        product_family: Dress
        pattern:
        - o: Solid
          p: 0.9
        - o: Stripe
          p: 0.1
    LinkItem:
      type: object
      required:
      - parent_id
      - child_id
      - relation
      - weight
      - updated_at
      properties:
        parent_id:
          type: string
        child_id:
          type: string
        relation:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        metadata:
          $ref: '#/components/schemas/LinkSignalMetadata'
        updated_at:
          type: string
          format: date-time
    LinkPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkItem'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
    SwarmInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        entity_ids:
          type: array
          items:
            type: string
        config:
          type: object
          additionalProperties: true
    IndexEntityRequest:
      type: object
      properties:
        model_id:
          type: string
          description: 'Encoder public id, or a predictor/decoder whose policy `encoder_model_id` is followed.

            Omit to index with every registry encoder that applies to `domain`.

            '
        content_id:
          type: string
          description: 'Public id of the content to write. When present, `entity_id` names the (existing)

            entity this content represents and no entity is created.

            '
        entity_id:
          type: string
          description: 'With `content_id`: the entity to link to (must exist). Alone: the one-record

            shortcut that upserts the entity and a same-id content. Alias `id`.

            '
        id:
          type: string
        kind:
          type: string
          enum:
          - text
          - image
          - audio
          - video
          description: Indexed content modality. Defaults to `image` when only `image_url` is given, else
            `text`.
        role:
          type: string
          description: Caller-defined role inside the entity, e.g. `description`, `primary_image`
        weight:
          type: number
          minimum: 0
          default: 1
          description: Relative weight of this content when the entity vector is composed
        image_url:
          type: string
          format: uri
          description: Image to encode (SigLIP-style encoders). Also read from `metadata.image_url` in
            the shortcut shape.
        text:
          type: string
          description: Alias of `content`
        type:
          type: string
          default: content
          description: Entity type; used only when an entity is upserted (shortcut shape)
        domain:
          type: string
          description: 'Optional when `model_id` names a domain-scoped model (or one whose encoder is);

            that domain is then implied. A conflicting value is `409 domain_mismatch`.

            '
        name:
          type: string
        content:
          type: string
        source_url:
          type: string
          format: uri
        url:
          type: string
          format: uri
          description: Alias of source_url
        metadata:
          type: object
          additionalProperties: true
          properties:
            readout:
              $ref: '#/components/schemas/EntityReadout'
            parent_asin:
              type: string
              description: Product grouping for the readout-state same-product penalty (`product_id` also
                accepted).
            duration_s:
              type: number
              description: Item (video) length in seconds, for relative dwell.
        embedding:
          type: array
          items:
            type: number
          description: 'Finite numbers. Used when the target encoder allows client embeddings and the

            length matches that encoder''s dimensions. With multiple registry encoders, each

            encoder uses the embedding only when it fits; the others encode from text.

            '
        embedding_model:
          type: string
          deprecated: true
          description: Use `model_id` (encoder) instead
    IndexEntityPublic:
      type: object
      required:
      - id
      - type
      - domain
      - name
      - metadata
      properties:
        id:
          type: string
        type:
          type: string
        domain:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    IndexEntityResponse:
      type: object
      required:
      - entity
      - content
      - vector_indexed
      properties:
        entity:
          oneOf:
          - $ref: '#/components/schemas/IndexEntityPublic'
          - type: 'null'
          description: The entity this content represents; null for unattached content
        content:
          oneOf:
          - $ref: '#/components/schemas/ContentSummary'
          - type: 'null'
          description: The content that was written; null when `POST /v1/entity` wrote identity only
        model_id:
          type: string
          description: Primary encoder that received a vector (first successful registry target)
        vector_indexed:
          type: boolean
        indexes:
          type: array
          description: One row per encoder the registry selected for this write
          items:
            type: object
            required:
            - model_id
            - vector_indexed
            properties:
              model_id:
                type: string
              vector_indexed:
                type: boolean
              error:
                type: string
    EntityDetail:
      type: object
      required:
      - id
      - type
      - domain
      - name
      - content
      - source_url
      - metadata
      - created_at
      - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        domain:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        content:
          type:
          - string
          - 'null'
          description: Text of the first text content (compatibility mirror of `contents`)
        source_url:
          type:
          - string
          - 'null'
          description: First content `source_url` (compatibility mirror of `contents`)
        metadata:
          type: object
          additionalProperties: true
        content_count:
          type: integer
          minimum: 0
        contents:
          type: array
          description: Every content linked to this entity
          items:
            $ref: '#/components/schemas/ContentSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentSummary:
      type: object
      required:
      - id
      - entity_id
      - kind
      - role
      - weight
      - domain
      - name
      - text
      - source_url
      - image_url
      - metadata
      - created_at
      - updated_at
      properties:
        id:
          type: string
        entity_id:
          type:
          - string
          - 'null'
          description: Entity this content represents; null when unattached
        kind:
          type: string
          enum:
          - text
          - image
          - audio
          - video
        role:
          type:
          - string
          - 'null'
        weight:
          type: number
        domain:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        source_url:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EntityContentsResponse:
      type: object
      required:
      - entity_id
      - items
      properties:
        entity_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
    AttachContentsRequest:
      type: object
      properties:
        content_id:
          type: string
        content_ids:
          type: array
          items:
            type: string
        role:
          type: string
        weight:
          type: number
          minimum: 0
    AttachedContent:
      allOf:
      - $ref: '#/components/schemas/ContentSummary'
      - type: object
        required:
        - vector_indexes
        properties:
          vector_indexes:
            type: array
            description: Encoders whose stored vector rows were retagged to the new owner
            items:
              type: string
    AttachContentsResponse:
      type: object
      required:
      - entity_id
      - attached
      - missing
      properties:
        entity_id:
          type: string
        attached:
          type: array
          items:
            $ref: '#/components/schemas/AttachedContent'
        missing:
          type: array
          description: Content ids in the request that do not exist
          items:
            type: string
    DetachContentResponse:
      type: object
      required:
      - entity_id
      - detached
      properties:
        entity_id:
          type: string
        detached:
          $ref: '#/components/schemas/AttachedContent'
    EntitySingleResponse:
      type: object
      required:
      - entity
      properties:
        entity:
          $ref: '#/components/schemas/EntityDetail'
    EntityTypesResponse:
      type: object
      required:
      - types
      properties:
        types:
          type: array
          description: Distinct entity types this workspace has used, alphabetical
          items:
            type: string
    LinkEntityRequest:
      type: object
      properties:
        content_id:
          type: string
          description: 'Child *entity* id (the name predates the entity/content split; aliases `child_id`,

            `entity_id`). This links two entities — a user to a product — and drives the

            parent''s user-state vector. To attach an indexed content to an entity use

            `POST /v1/entity/{entityId}/contents`.

            '
        child_id:
          type: string
        entity_id:
          type: string
        relation:
          type: string
          default: about
          description: 'Free text. These relations are interaction *signals* read by readout-state rankers

            (`hm-user-state-v1`): `like`, `unlike`, `save`, `unsave`, `add_to_bag`, `dwell`, `skip`

            (aliases: `about`/`liked` → like, `saved` → save, `add_to_cart`/`purchase`/`purchased` →

            add_to_bag, `skipped` → skip). One link per (parent, child, relation): posting it again

            updates it. like/unlike and save/unsave are toggles, the one set last wins (deleting the

            `like` link also cancels). `skip`, `unlike` and `unsave` links are not averaged into the

            composed state vector.

            '
        weight:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: Weight in the composed (weighted-mean) state vector. Readout-state rankers ignore
            it and use the signal weights of the model policy.
        metadata:
          $ref: '#/components/schemas/LinkSignalMetadata'
        model_id:
          type: string
          description: 'Latent model (decoder) that recomposes the parent''s state vector.

            Must be an active decoder in the platform or workspace catalog.

            Omitted uses the workspace compose default.

            '
    LinkSignalMetadata:
      type: object
      additionalProperties: true
      description: 'Signal payload stored on the link (under 4 KB). A `dwell` link needs `dwell_ms` (or
        `dwell_s`)

        to count as a signal; a dwell under 1.5 s counts as a fast skip.

        '
      properties:
        dwell_ms:
          type: number
          minimum: 0
          description: Time on screen in ms (`dwell` links).
        dwell_s:
          type: number
          minimum: 0
          description: Alternative to `dwell_ms`, in seconds.
        duration_s:
          type: number
          exclusiveMinimum: 0
          description: Item length in seconds. Falls back to the child entity's `metadata.duration_s`,
            else 30.
        at:
          oneOf:
          - type: number
            description: ms epoch
          - type: string
            format: date-time
          description: When the interaction happened. Defaults to the link's `updated_at`; orders signals
            for recency decay.
      example:
        dwell_ms: 8200
        duration_s: 21
        at: 1793340000000
    LinkStateReady:
      type: object
      required:
      - status
      - history_count
      properties:
        status:
          type: string
          const: ready
        history_count:
          type: integer
          minimum: 0
    LinkStatePending:
      type: object
      required:
      - status
      - reason
      properties:
        status:
          type: string
          const: pending
        reason:
          type: string
    LinkEntityResponse:
      type: object
      required:
      - parent_id
      - child_id
      - relation
      - weight
      - state
      properties:
        parent_id:
          type: string
        child_id:
          type: string
        relation:
          type: string
        weight:
          type: number
        metadata:
          $ref: '#/components/schemas/LinkSignalMetadata'
        model_id:
          type: string
          description: Decoder that composed the parent state vector
        state:
          oneOf:
          - $ref: '#/components/schemas/LinkStateReady'
          - $ref: '#/components/schemas/LinkStatePending'
    LinkStateCleared:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: cleared
          description: No links remain; the parent's state vectors were deleted
    UnlinkEntityResponse:
      type: object
      required:
      - parent_id
      - child_id
      - relations
      - removed
      - state
      properties:
        parent_id:
          type: string
        child_id:
          type: string
        relations:
          type: array
          items:
            type: string
          description: Relations that were removed
        removed:
          type: integer
          minimum: 1
        model_id:
          type: string
          description: Decoder that recomposed the parent state vector
        state:
          oneOf:
          - $ref: '#/components/schemas/LinkStateReady'
          - $ref: '#/components/schemas/LinkStatePending'
          - $ref: '#/components/schemas/LinkStateCleared'

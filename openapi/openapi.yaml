            run();
    patch:
      tags: [core]
      operationId: updateJob
      summary: Replace the payload of a pending job
      description: |
        Only `pending` jobs can be updated; the runner reads the payload when it
        starts the job. Jobs that are running or finished return 409.
      security: *workspaceSecurity
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateInput"
      responses:
        "200": {description: Job updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/JobConflict"}
      x-codeSamples:
        - lang: typescript
          label: updateJob
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              await galya.core.updateJob({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                jobId: "bdd5bfcb-b79c-4206-9c61-8b033d6d468f",
                body: {
                  payload: {
                    "key": "<value>",
                    "key1": "<value>",
                  },
                },
              });


            }

            run();
  /v1/jobs/{jobId}/cancel:
    post:
      tags: [core]
      operationId: cancelJob
      summary: Cancel a pending or running job
      description: |
        Sets the job to `cancelled`. A running job's work is not interrupted, but
        its outcome is discarded and the job stays `cancelled`. Connector syncs stop
        at the next page callback. Jobs that already finished return 409.
      security: *workspaceSecurity
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Job cancelled}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/JobConflict"}
      x-codeSamples:
        - lang: typescript
          label: cancelJob
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              await galya.core.cancelJob({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                jobId: "98449c4f-d645-4124-86e8-d3fc6fb8b978",
              });


            }

            run();
components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Galya-Admin-Key
    AdminBearer:
      type: http
      scheme: bearer
      description: Admin secret as Bearer token (same value as X-Galya-Admin-Key)
    WorkspaceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    WorkspaceBearer:
      type: http
      scheme: bearer
      description: Workspace API key (`galya_sk_...`) as Bearer token
    AgentKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Search-only agent key (`galya_ag_...`); valid on /v1/agentic-search/search and /manifest only
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^wsp_[a-zA-Z0-9_-]+$
    ContentIdPath:
      name: contentId
      in: path
      required: true
      schema:
        type: string
    EntityIdPath:
      name: entityId
      in: path
      required: true
      schema:
        type: string
    OptionalWorkspaceHeader:
      name: X-Galya-Workspace-Id
      in: header
      required: false
      schema:
        type: string
      description: Must match the workspace that owns the API key when set
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    JobConflict:
      description: The job's status does not allow this change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: job_not_cancellable
            message: Job is already completed
    UnauthorizedAdmin:
      description: Admin credentials invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: unauthorized
            message: Admin credentials are invalid
    AdminNotConfigured:
      description: Admin key is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: admin_not_configured
            message: Admin key is not configured
    MissingOrInvalidApiKey:
      description: Missing or invalid workspace API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    WorkspaceMismatch:
      description: X-Galya-Workspace-Id does not match the key's workspace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: workspace_mismatch
            message: API key does not belong to this workspace
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    GalyaQuery:
      type: object
      additionalProperties: false
      properties:
        expr:
          type: object
          required: [op]
          properties:
            op:
              type: string
              enum: [score, score_affinity, recommend, nearest, rerank, traverse, list, links]
          additionalProperties: true
        galyaql:
          type: string
        model:
          type: string
          description: Model for GalyaQL statements without a `BY` clause. There is no default.
      anyOf:
        - required: [expr]
        - required: [galyaql]
    GalyaQueryRequest:
      oneOf:
        - $ref: "#/components/schemas/GalyaQuery"
        - type: object
          additionalProperties: false
          required: [queries]
          properties:
            queries:
              type: array
              minItems: 1
              maxItems: 25
              items:
                $ref: "#/components/schemas/GalyaQuery"
    WorkspaceSettings:
      type: object
      required: [default_model_id, effective_default_model_id]
      properties:
        default_model_id: {type: [string, "null"]}
        effective_default_model_id:
          type: string
          description: What the shortcuts use now; `cosine-rank-v1` when none is set.
    GalyaQueryResult:
      type: object
      required: [compiled, explain, meta]
      properties:
        compiled: {type: object, additionalProperties: true}
        results:
          type: array
          items:
            type: object
            required: [entity_id, score, name, type]
            properties:
              entity_id: {type: string}
              score: {type: number}
              name: {type: [string, "null"]}
              type: {type: string}
              domain: {type: [string, "null"], description: "With `include: [metadata]`."}
              metadata: {type: object, additionalProperties: true, description: "With `include: [metadata]`."}
              contents:
                type: array
                description: "With `include: [contents]`."
                items: {type: object, additionalProperties: true}
        scores:
          type: array
          items: {type: object, additionalProperties: true}
        graph: {type: object, additionalProperties: true}
        entities:
          type: array
          description: "`list` only."
          items: {type: object, additionalProperties: true}
        next_cursor:
          type: [string, "null"]
          description: "`list` only."
        links:
          type: array
          description: "`links` only."
          items:
            $ref: "#/components/schemas/LinkItem"
        explain:
          type: object
          additionalProperties: true
          properties:
            user_state:
              type: string
              enum: [missing]
              description: Set when the user has no taste state yet.
            dropped:
              type: object
              properties:
                not_found: {type: array, items: {type: string}}
                no_vector: {type: array, items: {type: string}}
        meta:
          type: object
          required: [latency_ms]
          properties:
            latency_ms: {type: number}
            job_ids: {type: array, items: {type: string}}
            vector_index_note: {type: string}
    GalyaQueryBatchResult:
      type: object
      required: [results, meta]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/GalyaQueryResult"
              - type: object
                required: [error, message, status]
                properties:
                  error: {type: string}
                  message: {type: string}
                  status: {type: integer}
        meta:
          type: object
          properties:
            latency_ms: {type: number}
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query: {type: string}
        user_id: {type: string}
        domain: {type: string}
        model_id: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        include:
          type: array
          items: {type: string, enum: [metadata, contents]}
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
      anyOf:
        - required: [query]
        - required: [user_id]
    RecommendRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string}
        domain: {type: string}
        type: {type: string, default: content}
        model_id:
          type: string
          description: Defaults to the workspace's `default_model_id`, else `cosine-rank-v1`.
        include:
          type: array
          items: {type: string, enum: [metadata, contents]}
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
    RerankRequest:
      type: object
      additionalProperties: false
      required: [user_id, candidate_ids]
      properties:
        user_id: {type: string}
        candidate_ids:
          type: array
          minItems: 1
          items: {type: string}
        model_id:
          type: string
          description: |
            Defaults to the workspace's `default_model_id`, else `cosine-rank-v1`.
            `hm-user-state-v1` ranks by entity readouts against a looked-up user state, no vectors
            (see the operation description).
        include:
          type: array
          items: {type: string, enum: [metadata, contents]}
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
    RerankResponse:
      type: object
      additionalProperties: true
      properties:
        compiled: {type: object, additionalProperties: true}
        results:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [entity_id, score]
            properties:
              entity_id: {type: string}
              score: {type: number}
              name: {type: [string, "null"]}
              type: {type: string}
              base: {type: number, description: "Readout-state only. Score before the same-product penalty."}
              penalty: {type: number, description: "Readout-state only. Same-product penalty subtracted."}
              contributions:
                type: array
                description: Readout-state only. Top per-field terms of the score.
                items:
                  type: object
                  properties:
                    field: {type: string}
                    option: {type: string}
                    lift: {type: number}
              reason:
                type: string
                description: "Readout-state only, e.g. `↑ matches liked: Black, Dress`, `↓ less of: Stripe`, `exploring (cold start)`."
              metadata: {description: "With `include: [metadata]`."}
              contents: {type: array, items: {type: object, additionalProperties: true}, description: "With `include: [contents]`."}
        explain:
          type: object
          additionalProperties: true
          description: |
            `model_id`, `ranked_by` (`readout_loglik` for readout-state models), and for those also
            `state_source`, `state_error`, `state_fields` (fields the model state covered),
            `signals`, `readout_source` (`turbopuffer` / `metadata` counts) and
            `dropped: { not_found, no_readout }`.
        meta:
          type: object
          additionalProperties: true
          properties:
            latency_ms: {type: number}
            state_source:
              type: string
              enum: [model, cache, fallback, pooled]
              description: |
                Readout-state only. `model`: fresh from the model server; `cache`: stored state for the
                same positive interactions; `fallback`: the lookup failed (timeout, error, not
                configured) and the pooled formula ranked; `pooled`: no positive signal yet.
    EntityReadout:
      description: |
        Convention for entity `metadata.readout` (set with `POST /v1/entity` or `/v1/index`), read by
        readout-state rankers. One entry per field id (schema v3 field ids/options, e.g. `color`,
        `product_family`); each entry is one option, a `{option: p}` distribution (normalised on
        read), or a `[{o, p}]` list. The dashboard's `{fields: [{id, top: [{o, p}]}]}` form is
        accepted too. Add `metadata.parent_asin` (or `product_id`) for the same-product penalty and
        `metadata.duration_s` for relative dwell. Written to the Turbopuffer keyword row as attributes
        on index and by the `text_index` backfill job.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: object
                additionalProperties: {type: number, minimum: 0}
              - type: array
                items:
                  type: object
                  properties:
                    o: {type: string}
                    p: {type: number}
        - type: object
          required: [fields]
          properties:
            fields:
              type: array
              items:
                type: object
                required: [id, top]
                properties:
                  id: {type: string}
                  block: {type: string}
                  top:
                    type: array
                    items:
                      type: object
                      properties:
                        o: {type: string}
                        p: {type: number}
      example:
        color: {Black: 0.8, Grey: 0.2}
        product_family: Dress
        pattern: [{o: Solid, p: 0.9}, {o: Stripe, p: 0.1}]
    LinkItem:
      type: object
      required: [parent_id, child_id, relation, weight, updated_at]
      properties:
        parent_id: {type: string}
        child_id: {type: string}
        relation: {type: string}
        weight: {type: number, minimum: 0, maximum: 1}
        metadata:
          $ref: "#/components/schemas/LinkSignalMetadata"
        updated_at: {type: string, format: date-time}
    LinkPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LinkItem"
        next_cursor:
          oneOf:
            - {type: string}
            - {type: "null"}
    SwarmInput:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        entity_ids:
          type: array
          items: {type: string}
        config:
          type: object
          additionalProperties: true
    JobInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [batch_index, calibrate, simulation, connector_sync, cluster, trend_snapshot, landscape, text_index, vector_unindex]
        payload:
          type: object
          additionalProperties: true
        sync:
          type: boolean
          default: false
    JobUpdateInput:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          additionalProperties: true
          description: Replaces the job's payload
    RootResponse:
      type: object
      required: [service, environment, ok]
      properties:
        service:
          type: string
          const: galya-api
        environment:
          type: string
        ok:
          type: boolean
    HealthResponseReady:
      type: object
      required: [ok, db, schema]
      properties:
        ok:
          type: boolean
          const: true
        db:
          type: string
          const: up
        schema:
          type: string
          enum: [ready]
    HealthResponseSchemaMissing:
      type: object
      required: [ok, db, schema]
      properties:
        ok:
          type: boolean
          const: false
        db:
          type: string
          const: up
        schema:
          type: string
          const: missing
    HealthResponseDown:
      type: object
      required: [ok, db, error]
      properties:
        ok:
          type: boolean
          const: false
        db:
          type: string
          const: down
        error:
          type: string
    WorkspaceSummary:
      type: object
      required: [id, public_key, name, status, created_at, updated_at]
      properties:
        id:
          type: string
        public_key:
          type: string
          description: Workspace publishable key (`galya_pk_...`)
        name:
          type: string
        status:
          type: string
          enum: [active, paused]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceListResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
    WorkspaceSingleResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceSummary"
    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          description: Human-readable workspace name
        id:
          type: string
          pattern: ^wsp_[a-zA-Z0-9_-]{3,80}$
          description: Optional public workspace id; generated if omitted
    CreateWorkspaceResponse:
      type: object
      required: [workspace, public_key, api_key, warning]
      properties:
        workspace:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        public_key:
          type: string
          description: Workspace publishable key (`galya_pk_...`); stored and retrievable via admin
        api_key:
          type: string
          description: Workspace secret; shown once
        warning:
          type: string
    IndexEntityRequest:
      type: object
      properties:
        model_id:
          type: string
          description: |
            Encoder public id, or a predictor/decoder whose policy `encoder_model_id` is followed.
            Omit to index with every registry encoder that applies to `domain`.
        content_id:
          type: string
          description: |
            Public id of the content to write. When present, `entity_id` names the (existing)
            entity this content represents and no entity is created.
        entity_id:
          type: string
          description: |
            With `content_id`: the entity to link to (must exist). Alone: the one-record
            shortcut that upserts the entity and a same-id content. Alias `id`.
        id:
          type: string
        kind:
          type: string
          enum: [text, image, audio, video]
          description: Indexed content modality. Defaults to `image` when only `image_url` is given, else `text`.
        role:
          type: string
          description: Caller-defined role inside the entity, e.g. `description`, `primary_image`
        weight:
          type: number
          minimum: 0
          default: 1
          description: Relative weight of this content when the entity vector is composed
        image_url:
          type: string
          format: uri
          description: Image to encode (SigLIP-style encoders). Also read from `metadata.image_url` in the shortcut shape.
        text:
          type: string
          description: Alias of `content`
        type:
          type: string
          default: content
          description: Entity type; used only when an entity is upserted (shortcut shape)
        domain:
          type: string
          description: |
            Optional when `model_id` names a domain-scoped model (or one whose encoder is);
            that domain is then implied. A conflicting value is `409 domain_mismatch`.
        name:
          type: string
        content:
          type: string
        source_url:
          type: string
          format: uri
        url:
          type: string
          format: uri
          description: Alias of source_url
        metadata:
          type: object
          additionalProperties: true
          properties:
            readout:
              $ref: "#/components/schemas/EntityReadout"
            parent_asin:
              type: string
              description: Product grouping for the readout-state same-product penalty (`product_id` also accepted).
            duration_s:
              type: number
              description: Item (video) length in seconds, for relative dwell.
        embedding:
          type: array
          items:
            type: number
          description: |
            Finite numbers. Used when the target encoder allows client embeddings and the
            length matches that encoder's dimensions. With multiple registry encoders, each
            encoder uses the embedding only when it fits; the others encode from text.
        embedding_model:
          type: string
          deprecated: true
          description: Use `model_id` (encoder) instead
    IndexEntityPublic:
      type: object
      required: [id, type, domain, name, metadata]
      properties:
        id:
          type: string
        type:
          type: string
        domain:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    IndexEntityResponse:
      type: object
      required: [entity, content, vector_indexed]
      properties:
        entity:
          oneOf:
            - $ref: "#/components/schemas/IndexEntityPublic"
            - type: "null"
          description: The entity this content represents; null for unattached content
        content:
          oneOf:
            - $ref: "#/components/schemas/ContentSummary"
            - type: "null"
          description: The content that was written; null when `POST /v1/entity` wrote identity only
        model_id:
          type: string
          description: Primary encoder that received a vector (first successful registry target)
        vector_indexed:
          type: boolean
        indexes:
          type: array
          description: One row per encoder the registry selected for this write
          items:
            type: object
            required: [model_id, vector_indexed]
            properties:
              model_id:
                type: string
              vector_indexed:
                type: boolean
              error:
                type: string
    EntityDetail:
      type: object
      required:
        - id
        - type
        - domain
        - name
        - content
        - source_url
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        domain:
          type: [string, "null"]
        name:
          type: [string, "null"]
        content:
          type: [string, "null"]
          description: Text of the first text content (compatibility mirror of `contents`)
        source_url:
          type: [string, "null"]
          description: First content `source_url` (compatibility mirror of `contents`)
        metadata:
          type: object
          additionalProperties: true
        content_count:
          type: integer
          minimum: 0
        contents:
          type: array
          description: Every content linked to this entity
          items:
            $ref: "#/components/schemas/ContentSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentSummary:
      type: object
      required: [id, entity_id, kind, role, weight, domain, name, text, source_url, image_url, metadata, created_at, updated_at]
      properties:
        id:
          type: string
        entity_id:
          type: [string, "null"]
          description: Entity this content represents; null when unattached
        kind:
          type: string
          enum: [text, image, audio, video]
        role:
          type: [string, "null"]
        weight:
          type: number
        domain:
          type: [string, "null"]
        name:
          type: [string, "null"]
        text:
          type: [string, "null"]
        source_url:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentSingleResponse:
      type: object
      required: [content]
      properties:
        content:
          $ref: "#/components/schemas/ContentSummary"
    ContentListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
        next_cursor:
          type: [string, "null"]
    EntityContentsResponse:
      type: object
      required: [entity_id, items]
      properties:
        entity_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
    AttachContentsRequest:
      type: object
      properties:
        content_id:
          type: string
        content_ids:
          type: array
          items:
            type: string
        role:
          type: string
        weight:
          type: number
          minimum: 0
    AttachedContent:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          required: [vector_indexes]
          properties:
            vector_indexes:
              type: array
              description: Encoders whose stored vector rows were retagged to the new owner
              items:
                type: string
    AttachContentsResponse:
      type: object
      required: [entity_id, attached, missing]
      properties:
        entity_id:
          type: string
        attached:
          type: array
          items:
            $ref: "#/components/schemas/AttachedContent"
        missing:
          type: array
          description: Content ids in the request that do not exist
          items:
            type: string
    DetachContentResponse:
      type: object
      required: [entity_id, detached]
      properties:
        entity_id:
          type: string
        detached:
          $ref: "#/components/schemas/AttachedContent"
    EntitySingleResponse:
      type: object
      required: [entity]
      properties:
        entity:
          $ref: "#/components/schemas/EntityDetail"
    EntityTypesResponse:
      type: object
      required: [types]
      properties:
        types:
          type: array
          description: Distinct entity types this workspace has used, alphabetical
          items:
            type: string
    LinkEntityRequest:
      type: object
      properties:
        content_id:
          type: string
          description: |
            Child *entity* id (the name predates the entity/content split; aliases `child_id`,
            `entity_id`). This links two entities — a user to a product — and drives the
            parent's user-state vector. To attach an indexed content to an entity use
            `POST /v1/entity/{entityId}/contents`.
        child_id:
          type: string
        entity_id:
          type: string
        relation:
          type: string
          default: about
          description: |
            Free text. These relations are interaction *signals* read by readout-state rankers
            (`hm-user-state-v1`): `like`, `unlike`, `save`, `unsave`, `add_to_bag`, `dwell`, `skip`
            (aliases: `about`/`liked` → like, `saved` → save, `add_to_cart`/`purchase`/`purchased` →
            add_to_bag, `skipped` → skip). One link per (parent, child, relation): posting it again
            updates it. like/unlike and save/unsave are toggles, the one set last wins (deleting the
            `like` link also cancels). `skip`, `unlike` and `unsave` links are not averaged into the
            composed state vector.
        weight:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: Weight in the composed (weighted-mean) state vector. Readout-state rankers ignore it and use the signal weights of the model policy.
        metadata:
          $ref: "#/components/schemas/LinkSignalMetadata"
        model_id:
          type: string
          description: |
            Latent model (decoder) that recomposes the parent's state vector.
            Must be an active decoder in the platform or workspace catalog.
            Omitted uses the workspace compose default.
    LinkSignalMetadata:
      type: object
      additionalProperties: true
      description: |
        Signal payload stored on the link (under 4 KB). A `dwell` link needs `dwell_ms` (or `dwell_s`)
        to count as a signal; a dwell under 1.5 s counts as a fast skip.
      properties:
        dwell_ms: {type: number, minimum: 0, description: "Time on screen in ms (`dwell` links)."}
        dwell_s: {type: number, minimum: 0, description: "Alternative to `dwell_ms`, in seconds."}
        duration_s:
          type: number
          exclusiveMinimum: 0
          description: Item length in seconds. Falls back to the child entity's `metadata.duration_s`, else 30.
        at:
          oneOf:
            - {type: number, description: "ms epoch"}
            - {type: string, format: date-time}
          description: When the interaction happened. Defaults to the link's `updated_at`; orders signals for recency decay.
      example: {dwell_ms: 8200, duration_s: 21, at: 1793340000000}
    LinkStateReady:
      type: object
      required: [status, history_count]
      properties:
        status:
          type: string
          const: ready
        history_count:
          type: integer
          minimum: 0
    LinkStatePending:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          const: pending
        reason:
          type: string
    LinkEntityResponse:
      type: object
      required: [parent_id, child_id, relation, weight, state]
      properties:
        parent_id:
          type: string
        child_id:
          type: string
        relation:
          type: string
        weight:
          type: number
        metadata:
          $ref: "#/components/schemas/LinkSignalMetadata"
        model_id:
          type: string
          description: Decoder that composed the parent state vector
        state:
          oneOf:
            - $ref: "#/components/schemas/LinkStateReady"
            - $ref: "#/components/schemas/LinkStatePending"
    LinkStateCleared:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: cleared
          description: No links remain; the parent's state vectors were deleted
    UnlinkEntityResponse:
      type: object
      required: [parent_id, child_id, relations, removed, state]
      properties:
        parent_id:
          type: string
        child_id:
          type: string
        relations:
          type: array
          items:
            type: string
          description: Relations that were removed
        removed:
          type: integer
          minimum: 1
        model_id:
          type: string
          description: Decoder that recomposed the parent state vector
        state:
          oneOf:
            - $ref: "#/components/schemas/LinkStateReady"
            - $ref: "#/components/schemas/LinkStatePending"
            - $ref: "#/components/schemas/LinkStateCleared"
    LandscapePoint:
      type: object
      description: One indexed content vector, projected.
      required: [id, content_id, entity_id, type, domain, name, region_id, x, y, h, neighbors]
      properties:
        id:
          type: string
          description: Stable point id — the content id, or the entity id for legacy entity-level rows
        region_id:
          type: string
          description: Taste region (hill) the point sits on; matches `LandscapeRegion.id`
        content_id:
          type: string
          nullable: true
        entity_id:
          type: string
          description: Owning entity; empty when the content is unattached
        type:
          type: string
        domain:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        x:
          type: number
          description: Map coordinate in [-1, 1]
        y:
          type: number
          description: Map coordinate in [-1, 1]
        h:
          type: number
          description: Terrain height under the point, 0..1
        neighbors:
          type: array
          description: Nearest catalog neighbours by cosine similarity
          items:
            type: object
            required: [id, entity_id, score]
            properties:
              id:
                type: string
              entity_id:
                type: string
              score:
                type: number
    LandscapeRegion:
      type: object
      description: >-
        One hill on the landscape. `anchor` regions are the workspace's taste-region clusters; `derived` regions are grouped from the vectors when no anchors exist.
      required: [id, name, kind, source, x, y, h, radius, member_count]
      properties:
        id:
          type: string
          description: Anchor public id for `anchor` regions, `region_<n>` for derived ones
        name:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
          description: Anchor kind (for example `taste_region`); null for derived regions
        source:
          type: string
          enum: [anchor, derived]
        x:
          type: number
          description: Hill centre, map coordinate in [-1, 1]
        y:
          type: number
          description: Hill centre, map coordinate in [-1, 1]
        h:
          type: number
          description: Terrain height at the hill centre, 0..1
        radius:
          type: number
          description: Hill footprint radius in map units
        member_count:
          type: integer
    LandscapeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, pending, failed, missing]
        job_id:
          type: string
        stage:
          type: string
          enum: [pending, running]
          description: Job queue stage when `status` is `pending` or `failed`
        started_at:
          type: string
          format: date-time
          description: When the landscape job was enqueued
        updated_at:
          type: string
          format: date-time
        error:
          type: string
        method:
          type: string
          example: umap-regions-v1
        model_id:
          type: string
        dimensions:
          type: integer
        point_count:
          type: integer
        truncated:
          type: boolean
          description: True when the index held more vectors than the landscape cap
        computed_at:
          type: string
          format: date-time
        grid:
          type: object
          description: >-
            Row-major `size × size` terrain heights (0..1) over x,y ∈ [-extent, extent]. One hill per taste region; height grows with the region's member count.
          required: [size, extent, heights]
          properties:
            size:
              type: integer
            extent:
              type: number
            heights:
              type: array
              items:
                type: number
        regions:
          type: array
          description: Hills, largest first
          items:
            $ref: "#/components/schemas/LandscapeRegion"
        points:
          type: array
          items:
            $ref: "#/components/schemas/LandscapePoint"
    StartSessionRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        session_id:
          type: string
          description: Optional caller-chosen id; generated (`ses_*`) when omitted
    Session:
      type: object
      required: [session_id, user_id, status, started_at, request_count]
      properties:
        session_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [active, ended]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
        request_count:
          type: integer
    TrafficCountRow:
      type: object
      required: [count]
      properties:
        count: {type: integer}
        errors: {type: integer}
        p50_latency_ms: {type: integer, nullable: true}
    TrafficResponse:
      type: object
      required: [from, to, bucket, source, totals, previous, series, heatmap, operations, routes, statuses]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucket:
          type: string
          enum: [hour, day]
        source:
          type: string
          enum: [all, platform, agent]
        totals:
          type: object
          required: [requests, platform_requests, agent_requests, errors, error_rate, sessions_started, sessions_ended, active_sessions, unique_users, unique_agents]
          properties:
            requests: {type: integer}
            platform_requests: {type: integer}
            agent_requests: {type: integer}
            errors: {type: integer}
            error_rate: {type: number}
            p50_latency_ms: {type: integer, nullable: true}
            sessions_started: {type: integer}
            sessions_ended: {type: integer}
            active_sessions: {type: integer}
            unique_users: {type: integer}
            unique_agents: {type: integer}
            avg_requests_per_session: {type: number, nullable: true}
            median_session_seconds: {type: integer, nullable: true}
        previous:
          description: Same-length window immediately before `from`, for period-over-period deltas.
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            requests: {type: integer}
            platform_requests: {type: integer}
            agent_requests: {type: integer}
            errors: {type: integer}
            sessions_started: {type: integer}
            unique_users: {type: integer}
        series:
          type: array
          items:
            type: object
            required: [bucket, platform, agent, users, agents, errors]
            properties:
              bucket: {type: string}
              platform: {type: integer}
              agent: {type: integer}
              users: {type: integer, description: distinct people seen in the bucket}
              agents: {type: integer, description: distinct agents seen in the bucket}
              errors: {type: integer}
        heatmap:
          description: Requests by UTC day-of-week (0 = Sunday) and hour.
          type: array
          items:
            type: object
            properties:
              dow: {type: integer}
              hour: {type: integer}
              count: {type: integer}
        operations:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrafficCountRow"
              - type: object
                properties:
                  op: {type: string}
                  source: {type: string, enum: [platform, agent]}
        routes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrafficCountRow"
              - type: object
                properties:
                  route: {type: string, example: "POST /v1/query"}
        statuses:
          type: array
          items:
            type: object
            properties:
              klass: {type: string, example: "2xx"}
              count: {type: integer}
        people:
          nullable: true
          type: object
          properties:
            top_users:
              type: array
              items:
                type: object
                properties:
                  user_id: {type: string}
                  sessions: {type: integer}
                  requests: {type: integer}
                  last_seen: {type: string, format: date-time}
            session_length:
              type: array
              items:
                type: object
                properties:
                  bucket: {type: string, enum: [under_1m, 1_to_5m, 5_to_15m, 15_to_60m, over_1h]}
                  count: {type: integer}
            requests_per_session:
              type: array
              items:
                type: object
                properties:
                  bucket: {type: string, enum: ["0", "1_2", "3_5", "6_10", "11_plus"]}
                  count: {type: integer}
            new_vs_returning:
              type: object
              properties:
                new: {type: integer}
                returning: {type: integer}
        agents:
          nullable: true
          type: object
          properties:
            by_access:
              type: array
              items:
                type: object
                properties:
                  access: {type: string, enum: [key, mpp, x402]}
                  count: {type: integer}
            by_op:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/TrafficCountRow"
                  - type: object
                    properties:
                      op: {type: string}
            by_domain:
              type: array
              items:
                type: object
                properties:
                  domain: {type: string}
                  count: {type: integer}
            top_agents:
              type: array
              items:
                type: object
                properties:
                  agent_ref: {type: string}
                  requests: {type: integer}
                  errors: {type: integer}
                  last_seen: {type: string, format: date-time}
            top_keys:
              type: array
              items:
                type: object
                properties:
                  key_id: {type: string}
                  name: {type: string}
                  prefix: {type: string}
                  revoked: {type: boolean}
                  requests: {type: integer}
                  errors: {type: integer}
                  last_seen: {type: string, format: date-time}
    AgenticSearchOp:
      type: string
      enum: [search, recommend, rerank, traverse, get_entity]
    AgenticSearchConfig:
      type: object
      required: [enabled, name, description, allowed_ops, allowed_domains, allowed_types, default_model_id, max_results, max_hops, expose_metadata, paid_access_enabled, payment_methods]
      properties:
        enabled: {type: boolean}
        name: {type: string}
        description: {type: string, description: Shown to agents in the manifest}
        allowed_ops:
          type: array
          items:
            $ref: "#/components/schemas/AgenticSearchOp"
        allowed_domains:
          type: array
          items: {type: string}
          description: Empty means every domain
        allowed_types:
          type: array
          items: {type: string}
          description: Empty means every entity type
        default_model_id: {type: string}
        max_results: {type: integer, minimum: 1, maximum: 200}
        max_hops: {type: integer, minimum: 1, maximum: 4}
        expose_metadata: {type: boolean}
        rate_limit_per_minute: {type: integer, nullable: true}
        paid_access_enabled: {type: boolean}
        price_atomic: {type: string, nullable: true, description: Smallest unit of `currency`}
        currency: {type: string, nullable: true}
        payee: {type: string, nullable: true}
        payment_methods:
          type: array
          items:
            type: string
            enum: [mpp, x402]
        updated_at: {type: string, format: date-time, nullable: true}
    AgenticSearchConfigPatch:
      type: object
      description: Any subset of AgenticSearchConfig fields (except updated_at)
      properties:
        enabled: {type: boolean}
        name: {type: string}
        description: {type: string}
        allowed_ops:
          type: array
          items:
            $ref: "#/components/schemas/AgenticSearchOp"
        allowed_domains:
          type: array
          items: {type: string}
        allowed_types:
          type: array
          items: {type: string}
        default_model_id: {type: string}
        max_results: {type: integer}
        max_hops: {type: integer}
        expose_metadata: {type: boolean}
        rate_limit_per_minute: {type: integer, nullable: true}
        paid_access_enabled: {type: boolean}
        price_atomic: {type: string, nullable: true}
        currency: {type: string, nullable: true}
        payee: {type: string, nullable: true}
        payment_methods:
          type: array
          items:
            type: string
            enum: [mpp, x402]
    AgentKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: {type: string, description: "`agk_*`"}
        name: {type: string}
        prefix: {type: string, description: First 18 characters of the secret}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
    AgenticSearchManifest:
      type: object
      required: [workspace_id, name, description, enabled, endpoint, auth, capabilities, domains, entity_types, limits, tools]
      properties:
        workspace_id: {type: string}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        endpoint: {type: string, format: uri}
        manifest_url: {type: string, format: uri}
        auth:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items:
            type: object
            required: [op, description]
            properties:
              op:
                $ref: "#/components/schemas/AgenticSearchOp"
              description: {type: string}
        domains:
          type: array
          items: {type: string}
        entity_types:
          type: array
          items: {type: string}
        limits:
          type: object
          additionalProperties: true
        expose_metadata: {type: boolean}
        tools:
          type: array
          description: MCP-style tool definitions
          items:
            type: object
            additionalProperties: true
    AgenticSearchRequest:
      type: object
      required: [op]
      properties:
        op:
          $ref: "#/components/schemas/AgenticSearchOp"
        user_id: {type: string, description: Required for search, recommend: '', rerank: ''}
        domain:
          type: string
          description: |
            Catalog slice for search and recommend. Optional when the model chain implies a
            domain (predictor `domain`, else its encoder's `domain`); a conflicting value is
            `409 domain_mismatch`. When the workspace restricts `allowed_domains`, an unscoped
            model still needs an explicit domain (`400 domain_required`).
        type: {type: string, description: Entity type for recommend}
        candidate_ids:
          type: array
          items: {type: string}
          description: Required for rerank
        entity_id: {type: string, description: Required for get_entity}
        seed_entity_id: {type: string, description: Required for traverse}
        relation: {type: string}
        depth: {type: integer, description: Clamped to max_hops}
        limit: {type: integer, description: Clamped to max_results}
        model_id: {type: string, description: Defaults to the policy's default_model_id}
    AgenticSearchResponse:
      type: object
      required: [op, access]
      properties:
        op:
          $ref: "#/components/schemas/AgenticSearchOp"
        domain: {type: string, nullable: true}
        access:
          type: string
          enum: [key, mpp, x402]
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        scores:
          type: array
          items:
            type: object
            additionalProperties: true
        graph:
          type: object
          additionalProperties: true
        entity:
          type: object
          additionalProperties: true
        explain:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        policy:
          type: object
          additionalProperties: true
    PaymentRequiredBody:
      type: object
      required: [error, message, methods, challenges]
      properties:
        error: {type: string, const: payment_required}
        message: {type: string}
        price_atomic: {type: string}
        currency: {type: string}
        payee: {type: string}
        methods:
          type: array
          items:
            type: string
            enum: [mpp, x402]
        challenges:
          type: object
          additionalProperties: true
    ConnectorDefinition:
      type: object
      required: [public_id, name, description, category, status]
      properties:
        public_id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
        branding:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
        auth:
          type: object
          additionalProperties: true
        config_schema:
          type: object
          additionalProperties: true
        capabilities:
          type: object
          additionalProperties: true

            const galya = new Galya();

            async function run() {
              const result = await galya.core.getConcepts({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {});

              console.log(result);
            }

            run();
  /v1/landscape:
    get:
      tags: [core]
      operationId: getLandscape
      summary: Precomputed taste landscape for the workspace catalog
      description: |
        Returns the latest `landscape` job result: every indexed catalog vector
        projected to 2D (UMAP, cosine), the taste region each point sits on, a
        terrain heightfield with one hill per region (height grows with member
        count), and each point's nearest neighbours. Regions come from the
        workspace's `taste_region` clusters; with no anchors they are derived
        from the vectors. Everything is computed server-side —
        raw embeddings are never returned. `status` is `missing` until a
        landscape has been computed; use `POST /v1/landscape/refresh`.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: model_id
          in: query
          required: false
          schema:
            type: string
          description: Encoder public id. Defaults to the newest landscape for any encoder.
      responses:
        "200":
          description: Landscape state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandscapeResponse"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
      x-codeSamples:
        - lang: typescript
          label: getLandscape
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.getLandscape({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              });

              console.log(result);
            }

            run();
  /v1/landscape/refresh:
    post:
      tags: [core]
      operationId: refreshLandscape
      summary: Recompute the taste landscape
      description: |
        Enqueues a `landscape` job that reads the catalog vectors from the vector
        index and projects them. With `sync=true` the response carries the
        finished landscape; otherwise poll `GET /v1/landscape`.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: sync
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id:
                  type: string
                  description: Encoder public id. Defaults to the platform encoder.
                type:
                  type: string
                  description: Only entities of this type
                domain:
                  type: string
                  description: Only entities in this content domain
                sync:
                  type: boolean
      responses:
        "200":
          description: Landscape computed (sync)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandscapeResponse"
        "202":
          description: Landscape job queued
          content:
            application/json:
              schema:
                type: object
                required: [status, job_id, poll]
                properties:
                  status:
                    type: string
                    enum: [pending]
                  job_id:
                    type: string
                  poll:
                    type: string
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "500":
          description: Landscape job failed (`sync=true` only)
          content:
            application/json:
              schema:
                type: object
                required: [status, job_id, error]
                properties:
                  status:
                    type: string
                    enum: [failed]
                  job_id:
                    type: string
                  error:
                    type: string
      x-codeSamples:
        - lang: typescript
          label: refreshLandscape
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.refreshLandscape({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {});

              console.log(result);
            }

            run();

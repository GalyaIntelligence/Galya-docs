  /v1/rerank:
    post:
      tags:
      - core
      operationId: rerankForUser
      summary: Rerank supplied candidate entity ids for a user
      description: "Vector models (`cosine-rank-v1`, ...) rank the candidates against the user's state\
        \ vector.\n\n**Readout-state models** (`hm-user-state-v1`: the H&M user-state model on the System\
        \ 1\nserver, EC2 us-east-1) use no vectors:\n\n1. *Signals* are the user's links (`POST /v1/entity/{user}/link`\
        \ with `relation` = `like`,\n   `save`, `add_to_bag`, `dwell`, `skip`, `unlike`, `unsave`; see\
        \ `LinkSignalMetadata`).\n   Weights: like +1, save +1.5, add_to_bag +2, dwell 0.5 · clip(relative\
        \ dwell, 0, 2) where\n   relative dwell = (dwell / duration) / median over the user's dwells,\
        \ fast skip (< 1.5 s)\n   or skip −0.5; recency decay 0.5^(interactions after it / 4).\n2. *Readouts*\
        \ are fetched by id as attributes (no vector query) for the linked\n   and the candidate entities;\
        \ they come from entity `metadata.readout` (see\n   `EntityReadout`), with stored metadata filling\
        \ entities not re-indexed yet.\n3. *User state*: the positive interactions go to the model server.\
        \ The\n   result is cached per (user, positive-interaction list) and refreshed in the background\n\
        \   after link writes. On failure the pooled taste formula is used and\n   `meta.state_source`\
        \ is `fallback`.\n4. *Score* (the live-shop dashboard's formula): per field, the expected log-lift\n\
        \   log S − log P of the user state S over the candidates' marginal P (Dirichlet prior\n   α =\
        \ 2, eps 1e-3; skips push mass away, β = 1.5), centred per field, minus 1.5 per\n   recently interacted\
        \ item of the same product (`metadata.parent_asin` / `product_id`).\n   Candidates without a readout\
        \ are dropped (`explain.dropped.no_readout`).\n\nReadout-state models only rerank; other ops answer\
        \ `model_op_unsupported`.\n"
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
            examples:
              vector:
                value:
                  user_id: u1
                  candidate_ids:
                  - dress_a
                  - dress_b
              readoutState:
                summary: H&M user-state model (no vectors)
                value:
                  user_id: shopper_1
                  candidate_ids:
                  - vid_1
                  - vid_2
                  - vid_3
                  model_id: hm-user-state-v1
                  include:
                  - metadata
      responses:
        '200':
          description: Reranked candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-codeSamples:
      - lang: typescript
        label: rerankForUser
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya();\n\
          \nasync function run() {\n  const result = await galya.core.rerankForUser({\n    workspaceApiKey:\
          \ process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n  }, {\n    body: {\n      user_id: \"\
          u1\",\n      candidate_ids: [\n        \"dress_a\",\n        \"dress_b\",\n      ],\n    },\n\
          \  });\n\n  console.log(result);\n}\n\nrun();"
      x-mint:
        metadata:
          description: Rerank supplied candidate entity ids for a user. Vector models (cosine-rank-v1,
            ...) rank the candidates against the user's state vector. POST /v1/rerank...
          noindex: true

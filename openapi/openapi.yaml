  /v1/search:
    post:
      tags:
      - core
      operationId: searchWorkspace
      summary: Search indexed content semantically or retrieve nearest items for a user
      description: 'With `query` and no `model_id`, search is hybrid: BM25 over each entity''s

        name, text and short metadata strings, plus nearest neighbors in the text

        and image-text encoder spaces, fused by weighted reciprocal rank

        (`explain.retrieval: hybrid_rrf`). `explain.legs` reports candidates and

        any error per leg; one failing leg degrades results instead of failing the

        call. Keyword hits that match only some query terms are kept only when the

        text encoder also places them near the query (`explain.legs.bm25.dropped`

        counts the rest); hits with every term rank first. The keyword index is kept current on index
        calls and rebuilt with a

        `text_index` job. With `model_id`, only that encoder is searched.

        '

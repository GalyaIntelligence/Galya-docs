            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Every retrieval leg failed (keyword index and both encoders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

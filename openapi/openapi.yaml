openapi: 3.1.0
info:
  title: Galya API
  version: 0.1.0
  description: |
    Index a catalog, link taste, and query it.

    Workspace data routes accept a workspace secret (`galya_sk_...`) or an account key
    (`galya_ak_...`) plus `X-Galya-Workspace-Id`, via `X-API-Key` or `Authorization: Bearer`.
    Account provisioning routes require `galya_ak_...` only.
    Admin routes require `X-Galya-Admin-Key` or Bearer with the global admin secret.
servers:
  - url: https://dev.api.galya.io
    description: Development API
tags:
  - name: meta
    description: Service metadata and health
  - name: admin
    description: Workspace provisioning (admin only)
  - name: core
    description: Entity index, read, and link operations
  - name: connectors
    description: Native connector registry and workspace connections
  - name: sessions
    description: End-user sessions that attribute platform traffic
  - name: traffic
    description: Request volume split by end users vs agents
  - name: agentic-search
    description: Expose the graph to outside agents under a workspace policy
  - name: agents
    description: Hosted Hermes sandboxes, skills, and MCP config
paths:
  /:
    get:
      tags: [meta]
      operationId: getRoot
      summary: Service info
      security: []
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
      x-codeSamples:
        - lang: typescript
          label: getRoot
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.meta.getRoot();

              console.log(result);
            }

            run();

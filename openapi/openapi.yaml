  /v1/index:
    post:
      tags: [core]
      operationId: indexEntity
      summary: Index one content (text, image, …) and write its vectors
      description: |
        Contents and entities are separate records. A content is one indexed artifact
        and carries the vectors; an entity is the thing you recommend, score and traverse.
        Many contents link to one entity (a product with three photos and a description);
        the entity's vector is composed from its contents at read time.

        Body shapes:
        - `content_id` (+ optional `entity_id`): write this content. `entity_id` names the
          entity it represents and must already exist (`404 entity_not_found` otherwise).
          Without `entity_id` the content stays unattached: searchable, never a candidate.
        - `entity_id` alone (no `content_id`): the one-record shortcut. Upserts the entity
          (`type`, `name`, `metadata`) and writes a same-id content linked to it. This is the
          pre-split body shape, so existing callers keep working.
        - neither: an unattached content with a generated `cnt_…` id.

        `model_id` may be an encoder, or a predictor/decoder whose policy names an encoder.
        When `model_id` is omitted, the content is written into every active encoder the
        registry would use for its domain. Omitted fields on an existing content are kept.
        Use `POST /v1/entity` to create entities on purpose, and
        `POST /v1/entity/{entityId}/contents` to attach contents indexed earlier.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexEntityRequest"
      responses:
        "201":
          description: Entity upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexEntityResponse"
        "400":
          description: Invalid JSON or embedding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: typescript
          label: indexEntity
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.indexEntity({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                body: {
                  metadata: {
                    readout: {
                      "color": {
                        "Black": 0.8,
                        "Grey": 0.2,
                      },
                      "product_family": "Dress",
                      "pattern": [
                        {
                          o: "Solid",
                          p: 0.9,
                        },
                        {
                          o: "Stripe",
                          p: 0.1,
                        },
                      ],
                    },
                  },
                },
              });

              console.log(result);
            }

            run();
  /v1/entity:
    post:
      tags: [core]
      operationId: upsertEntity
      summary: Upsert an entity (identity only, no vectors)
      description: |
        Writes `entity_id`, `type`, `domain`, `name`, `metadata`. Nothing is embedded.
        Index contents with `POST /v1/index` (`content_id` + `entity_id`) and they compose
        the entity's vector at read time. `model_id` may be passed to imply `domain` from a
        domain-scoped model.

        Compatibility: when the body also carries content fields (`content`, `embedding`,
        `source_url`, `image_url`, …) this behaves like the `/v1/index` shortcut and writes
        a same-id content too, exactly as before the split.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexEntityRequest"
      responses:
        "201":
          description: Entity upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexEntityResponse"
        "400":
          description: Invalid JSON or embedding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
      x-codeSamples:
        - lang: typescript
          label: upsertEntity
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.upsertEntity({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                body: {
                  metadata: {
                    readout: {
                      "color": {
                        "Black": 0.8,
                        "Grey": 0.2,
                      },
                      "product_family": "Dress",
                      "pattern": [
                        {
                          o: "Solid",
                          p: 0.9,
                        },
                        {
                          o: "Stripe",
                          p: 0.1,
                        },
                      ],
                    },
                  },
                },
              });

              console.log(result);
            }

            run();

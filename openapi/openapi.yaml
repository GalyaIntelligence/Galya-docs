  /v1/agentic-search/search:
    post:
      tags: [agentic-search]
      operationId: agenticSearch
      summary: Search the graph as an agent
      description: |
        The only endpoint agent keys may call and the only source of agent traffic.
        Runs the request under the workspace policy: ops outside `allowed_ops` return
        `403 op_not_exposed`, domains/types outside the allow-lists return
        `403 domain_not_exposed` / `type_not_exposed`, and `limit` / `depth` are clamped.

        Access: any Galya key (`galya_ag_`, `galya_sk_`, `galya_ak_`). When the workspace has
        `paid_access_enabled`, unkeyed calls carrying `X-Galya-Workspace-Id` get `402` with an MPP
        `WWW-Authenticate: Payment` challenge and an x402 `PAYMENT-REQUIRED` header; retry with
        `Authorization: Payment <credential>` or `PAYMENT-SIGNATURE`. Optional `X-Galya-Agent-Id`
        is stored for attribution only.
      security:
        - AgentKey: []
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
        - {}
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: X-Galya-Agent-Id
          in: header
          required: false
          schema:
            type: string
          description: Caller-supplied agent identity (e.g. an ERC-8004 id); never verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgenticSearchRequest"
      responses:
        "200":
          description: Search results, scores, graph, or entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgenticSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing/invalid key or search disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "402":
          description: Payment required (paid access on, no valid credential)
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: MPP challenge (`Payment realm=... amount=... currency=... payee=...`)
            PAYMENT-REQUIRED:
              schema: {type: string}
              description: Base64 x402 payment requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequiredBody"
        "403":
          description: Policy rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Paid access on but price, payee, or facilitator missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
      x-codeSamples:
        - lang: typescript
          label: agenticSearch
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();


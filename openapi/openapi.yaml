  /v1/query:
    post:
      tags: [core]
      operationId: runGalyaQuery
      summary: Execute a typed Galya expression or GalyaQL string, or a batch of them
      description: |
        Send one query as `expr` or `galyaql`, or up to 25 as `queries`. Batch
        queries run in parallel and come back in order; a failing query holds
        `{ error, message, status }` in its slot and the batch still returns 200.

        There is no default model here. Ranking statements name one with `BY
        <model>`, the request's `model`, or `expr.model_id`; without one the query
        is a 400 `invalid_expr`. (The `/v1/rerank`, `/v1/recommend` and
        `/v1/search` shortcuts fall back to the workspace's `default_model_id`.)

        A shopper with no taste state yet is not an error: `rerank` keeps the
        candidates in the order given, `recommend` and `nearest` return no
        results, and all three set `explain.user_state: missing`.

        GalyaQL statements (one per query; a trailing `;` is allowed; optional
        clauses may come in any order; quote an id that holds spaces, commas, or
        a keyword). Parse errors give the character position.
        - `SCORE <entity> BY <model> RELATIVE_TO <user:id | entity:id>`
        - `SCORE AFFINITY <entity> BY <model>`
        - `FIND SIMILAR_TO <user> TYPE <type> LIMIT <n> [BY <model>]`
        - `NEAREST TO taste(<user>) LIMIT <n> [BY <model>]`
        - `RERANK <id>[,<id>...] FOR <user> [BY <model>]`
        - `FIND RELATED TO <entity> [RELATION <relation>] [DEPTH <n>]`
        - `LIST TYPE <type>[,<type>...] [DOMAIN <domain>] [LIMIT <n>]` — catalog
          page in `entities` with `next_cursor` (pass it back as `expr.cursor`)
        - `LINKS FROM <id>[,<id>...] [RELATION <relation>] [LIMIT <n>]` — the
          newest `n` links per parent in `links`, oldest first per parent

        `LIST`, `FIND SIMILAR_TO`, `NEAREST` and `RERANK` may end with
        `INCLUDE metadata[,contents]` (`expr.include`) to return each entity's
        metadata and contents with the result.

        Every expression is validated before it runs: `limit` 1–1000, `depth`
        1–5, at most 1000 distinct `candidate_ids`. Rerank candidates that are
        unknown or have no vector yet are listed in `explain.dropped`. When more
        than a few candidates lack vectors, they are queued for indexing
        (`meta.job_ids`) instead of encoded inside the request.
      security: &workspaceSecurity
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalyaQueryRequest"
      responses:
        "200":
          description: Query result, or `{ results, meta }` for a batch
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GalyaQueryResult"
                  - $ref: "#/components/schemas/GalyaQueryBatchResult"
        "400":
          description: |
            `invalid_expr` (the message names the field), `unknown_field` (a
            field this endpoint does not read, named with the allowed ones),
            `galyaql_parse_error` (the message gives the position), or `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
      x-codeSamples:
        - lang: typescript
          label: runGalyaQuery
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.runGalyaQuery({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                body: {
                  expr: {
                    op: "links",
                  },
                },
              });

              console.log(result);
            }

            run();

openapi: 3.1.0
info:
  title: Galya API
  version: 0.1.0
  description: 'Natural-language commerce API: index catalog items, record shopper interactions, and rank,
    search and

    recommend by taste.


    Authenticate with a workspace secret (`galya_sk_...`) in `X-API-Key` or `Authorization: Bearer`.

    An account key (`galya_ak_...`) also works together with `X-Galya-Workspace-Id`.


    **One model.** Every call runs on `galya-natural-language-commerce`. There is nothing to choose;

    model upgrades ship behind the same API and `meta.model_version` reports which one answered.


    **Item, User, Schema.** Put catalog data in with `/v1/item` (each item''s readout is its index) and
    do

    everything about a shopper with `POST /v1/user`: record interactions by item id and a plain-language

    tag, read their taste, and search, rank or recommend. Every item and user call names a **schema**
    (an

    id, or an inline definition from your code that Galya stores by content hash); `/v1/schemas` lists
    and

    manages them. `POST /v1/search`, `POST /v1/rerank` and `POST /v1/recommend` are conveniences for the

    common ranking intents.

    '
servers:
- url: https://api.galya.io
  description: Production
tags:
- name: item
  description: Catalog items and their taste readouts (the index)
- name: user
  description: Interactions, taste profiles, search and ranking for one shopper
- name: schema
  description: Taste schemas (immutable, content-addressed; unlimited per workspace)
paths:
  /v1/item:
    post:
      tags:
      - item
      operationId: upsertItems
      summary: Upsert items; the model reads each one into a taste readout
      description: 'The one way to put catalog data into Galya. Each item is one record (a product, a
        video,

        a look) with its text, image and your metadata. There is no separate index call: an item''s

        **readout** — a probability distribution over options for every field of the schema — *is*

        the index.


        Every call names a **`schema`**: a schema id (`galya-commerce-v3`, `sch_…`) or an inline

        definition, which is stored and answered with its content-addressed id (`schema_id`). Items

        are read once per schema: one item can carry readouts for any number of schemas.


        Reading an item takes the model ~4 s of GPU time per schema, so this call is

        **asynchronous**: it returns `202` with each item''s `status` for that schema (`pending`

        while queued, `ready` when the stored readout is current). Poll `GET /v1/item/{itemId}`

        or the returned `job_id`. Items whose `text` and `image_url` are unchanged are not read

        again for a schema they already have.


        Supply `readout` yourself to skip the model; it is stored under the call''s schema (your own

        field ids are fine). Upserts are idempotent by `id`; omitted fields are kept.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpsertRequest'
            examples:
              products:
                summary: Two apparel products, read with galya-commerce-v3
                value:
                  schema: galya-commerce-v3
                  items:
                  - id: gid_8123
                    title: Black wrap midi dress
                    text: Wrap silhouette, crepe, midi length.
                    image_url: https://cdn.shopify.com/s/files/dress.jpg
                    metadata:
                      product_id: '8123'
                      price: 129
                      vendor: Acme
                  - id: gid_8124
                    title: Leather ankle boot
                    image_url: https://cdn.shopify.com/s/files/boot.jpg
              inlineSchema:
                summary: An inline schema from your code (stored, id returned)
                value:
                  schema:
                    name: occasion-and-fit
                    base: galya-commerce-v3
                    questions:
                    - id: occasion
                      text: What occasion is this product for?
                      options:
                      - Work
                      - Party
                      - Everyday
                    - id: fit
                      text: How does it fit?
                      options:
                      - Slim
                      - Regular
                      - Relaxed
                  items:
                  - id: gid_8123
                    title: Black wrap midi dress
                    image_url: https://cdn.shopify.com/s/files/dress.jpg
              supplied:
                summary: Bring your own readout (no model call)
                value:
                  schema: sch_9b1f2e7c4a
                  items:
                  - id: sku_77
                    title: Linen shirt
                    readout:
                      color:
                        White: 0.9
                        Beige: 0.1
                      product_family: Shirt
      responses:
        '202':
          description: Accepted; readouts are generated in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemUpsertResponse'
              example:
                schema_id: galya-commerce-v3
                job_id: job_01JD4X
                items:
                - id: gid_8123
                  status: pending
                - id: gid_8124
                  status: ready
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
      x-mint:
        metadata:
          description: Upsert items; the model reads each one into a taste readout. The one way to put
            catalog data into Galya. Each item is one record (a product, a video, a...
          noindex: true
    get:
      tags:
      - item
      operationId: listItems
      summary: List items, optionally filtered by readout attributes
      description: 'Filter the catalog by readout attributes and metadata. `where` matches readout options

        (an item matches `color = "Black"` when its readout gives `Black` at least `min_p`) and

        metadata (`metadata.vendor = "Acme"`). Grammar:

        `<field> = "<option>"`, `<field> IN ("<a>", "<b>")`, `metadata.<key> = <value>`, joined by `AND`.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      - name: schema
        in: query
        description: Schema id whose readouts `where`, `status` and `include=readout` apply to. Required
          when any of them is used.
        schema:
          type: string
          example: galya-commerce-v3
      - name: where
        in: query
        schema:
          type: string
        example: product_family = "Dress" AND color IN ("Black", "Navy")
      - name: min_p
        in: query
        description: Minimum option probability for a readout match.
        schema:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ItemStatus'
      - name: include
        in: query
        description: Comma-separated. `readout` adds each item's readout.
        schema:
          type: string
          example: readout
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A page of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
      x-mint:
        metadata:
          description: List items, optionally filtered by readout attributes. Filter the catalog by readout
            attributes and metadata. where matches readout options (an item...
          noindex: true
  /v1/item/{itemId}:
    parameters:
    - $ref: '#/components/parameters/ItemIdPath'
    - $ref: '#/components/parameters/OptionalWorkspaceHeader'
    get:
      tags:
      - item
      operationId: getItem
      summary: Read one item and its readouts
      description: '`readouts` holds one entry per schema the item has been read with; `schema` narrows
        it to one.'
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - name: schema
        in: query
        schema:
          type: string
          example: galya-commerce-v3
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Read one item and its readouts. readouts holds one entry per schema the item has
            been read with; schema narrows it to one. GET /v1/item/{itemId} in the...
          noindex: true
    put:
      tags:
      - item
      operationId: putItem
      summary: Upsert one item (same semantics as POST /v1/item)
      description: Convenient for product webhooks. Returns `202` while the readout is pending, `200`
        when unchanged.
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutItemRequest'
      responses:
        '200':
          description: Stored; readout already current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '202':
          description: Stored; readout pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
      x-mint:
        metadata:
          description: Upsert one item (same semantics as POST /v1/item). Convenient for product webhooks.
            Returns 202 while the readout is pending, 200 when unchanged. PUT...
          noindex: true
    delete:
      tags:
      - item
      operationId: deleteItem
      summary: Delete an item and its readout
      description: Interactions that reference the item are kept but no longer count toward taste.
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Delete an item and its readout. Interactions that reference the item are kept but
            no longer count toward taste. DELETE /v1/item/{itemId} in the Galya API...
          noindex: true
  /v1/user:
    post:
      tags:
      - user
      operationId: userCall
      summary: Record interactions, read taste, and rank — in one call
      description: "Everything about a shopper goes through this call. **`schema`** is required (an id\
        \ or an\ninline definition, as on `POST /v1/item`); everything else is optional:\n\n- **`interactions`**\
        \ link items into the user's history. Each has an `item_id` and a\n  natural-language `tag` (\"\
        added to bag\", \"liked\", \"watched 12s\", \"skipped\", \"bought\").\n  Galya maps the tag to\
        \ a known signal (`read_as` in the response) for weighting and\n  keeps the raw text for the model.\
        \ Interactions are idempotent by `id`: a retried call\n  does not double count. An interaction\
        \ with an unknown `item_id` is not stored (status\n  `item_unknown`): upsert the item first. One\
        \ with an item whose readout is still pending is\n  stored (`item_pending`) and counts once the\
        \ readout exists. Unknown users are created on\n  first call. Tags read as `view` (no dwell),\
        \ `impression` or `other` are stored but do not\n  move taste yet.\n- **`rank`** ranks items for\
        \ this user by taste. With `item_ids` it reranks exactly those\n  (≤ 1000); with `query` it searches\
        \ (\"black boots for work\") and ranks the matches; with\n  neither, it recommends from the whole\
        \ catalog. `where` narrows any of them.\n  Every ranked item carries `reasons`: the readout fields\
        \ and options that lifted it.\n- **`include: [taste]`** returns the user's taste profile.\n\n\
        Interactions do not depend on a schema: they are stored once, and taste is computed per\nschema\
        \ at query time from the readouts of the interacted items. So the same history can be\nread through\
        \ any number of schemas. Items with no readout for the call's schema yet are\nqueued for one and\
        \ listed in `not_ranked` (`pending`).\n\nInteractions recorded in a call are applied before that\
        \ call's ranking. A shopper with no\ninteractions gets `score: 0` for every item; results then\
        \ keep the order of `item_ids`\n(or catalog order), so callers can always render them.\n\nTaste\
        \ is looked up from the model at query time and cached per interaction history; if the\nmodel\
        \ is unavailable the pooled taste is used and `meta.state_source` says so.\n"
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            examples:
              track:
                summary: Pixel — record interactions only
                value:
                  user_id: shop_client_9f2c
                  schema: galya-commerce-v3
                  interactions:
                  - id: evt_1
                    item_id: gid_8123
                    tag: viewed
                    dwell_ms: 12000
                    context:
                      surface: collection
                      position:
                        y: 0.2
                        x: 0.5
                        area: 0.08
                  - id: evt_2
                    item_id: gid_8123
                    tag: added to bag
              rerank:
                summary: Rerank a collection page
                value:
                  user_id: shop_client_9f2c
                  schema: galya-commerce-v3
                  rank:
                    item_ids:
                    - gid_8123
                    - gid_8124
                    - gid_8125
                    limit: 3
              recommend:
                summary: Recommend from the catalog through a custom schema, with taste
                value:
                  user_id: shop_client_9f2c
                  schema: sch_9b1f2e7c4a
                  rank:
                    limit: 8
                    where: product_family = "Dress"
                  include:
                  - taste
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                user_id: shop_client_9f2c
                schema_id: galya-commerce-v3
                interactions:
                - id: evt_2
                  item_id: gid_8123
                  tag: added to bag
                  read_as: add_to_bag
                  status: recorded
                ranked:
                - item_id: gid_8125
                  score: 0.42
                  reasons:
                  - field: color
                    option: Black
                    lift: 0.31
                  - field: silhouette
                    option: Wrap
                    lift: 0.11
                - item_id: gid_8124
                  score: 0.05
                  reasons: []
                meta:
                  model_version: galya-natural-language-commerce@2026-10
                  state_source: model
                  latency_ms: 38
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '403':
          $ref: '#/components/responses/WorkspaceMismatch'
      x-mint:
        metadata:
          description: Record interactions, read taste, and rank — in one call. Everything about a shopper
            goes through this call. schema is required (an id or an inline...
          noindex: true
  /v1/user/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserIdPath'
    - $ref: '#/components/parameters/OptionalWorkspaceHeader'
    get:
      tags:
      - user
      operationId: getUser
      summary: Read a user's taste profile through a schema
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - name: schema
        in: query
        required: true
        description: Schema id the taste is expressed in.
        schema:
          type: string
          example: galya-commerce-v3
      - name: include
        in: query
        description: Comma-separated. `interactions` adds the most recent interactions.
        schema:
          type: string
          example: interactions
      responses:
        '200':
          description: The user's taste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Read a user's taste profile through a schema. GET /v1/user/{userId} in the Galya
            API reference.
          noindex: true
    delete:
      tags:
      - user
      operationId: deleteUser
      summary: Erase a user, their interactions and cached taste
      description: For privacy requests (e.g. Shopify `customers/redact`). Irreversible.
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      responses:
        '204':
          description: Erased
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Erase a user, their interactions and cached taste. For privacy requests (e.g. Shopify
            customers/redact). Irreversible. DELETE /v1/user/{userId} in the...
          noindex: true
  /v1/schemas:
    parameters:
    - $ref: '#/components/parameters/OptionalWorkspaceHeader'
    post:
      tags:
      - schema
      operationId: createSchema
      summary: Store a schema and get its id
      description: 'Schemas are defined in your code and are **immutable and content-addressed**: the
        id is a

        hash of `base` + `questions`, so the same definition always gets the same id and posting it

        again returns `200` with that id. Changing a definition makes a new schema; the old one and

        its readouts stay usable. There is no limit on how many a workspace has.


        You rarely need this call: `/v1/item` and `/v1/user` accept the definition inline and store

        it the same way. Use it to register schemas ahead of time (e.g. at deploy).

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinition'
            example:
              name: occasion-and-fit
              base: galya-commerce-v3
              questions:
              - id: occasion
                text: What occasion is this product for?
                options:
                - Work
                - Party
                - Everyday
              - id: fit
                text: How does it fit?
                options:
                - Slim
                - Regular
                - Relaxed
      responses:
        '200':
          description: Already stored (same definition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
      x-mint:
        metadata:
          description: 'Store a schema and get its id. Schemas are defined in your code and are immutable
            and content-addressed: the id is a hash of base + questions, so the same...'
          noindex: true
    get:
      tags:
      - schema
      operationId: listSchemas
      summary: List the schemas this workspace can use
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A page of schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaPage'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
      x-mint:
        metadata:
          description: List the schemas this workspace can use. GET /v1/schemas in the Galya API reference.
          noindex: true
  /v1/schemas/{schemaId}:
    parameters:
    - $ref: '#/components/parameters/SchemaIdPath'
    - $ref: '#/components/parameters/OptionalWorkspaceHeader'
    get:
      tags:
      - schema
      operationId: getSchema
      summary: Read a schema, including how many items have readouts for it
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      responses:
        '200':
          description: The schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Read a schema, including how many items have readouts for it. GET /v1/schemas/{schemaId}
            in the Galya API reference.
          noindex: true
    delete:
      tags:
      - schema
      operationId: deleteSchema
      summary: Delete a schema and every readout made with it
      description: '`galya-commerce-v3` cannot be deleted (`400`). Interactions are untouched.'
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        metadata:
          description: Delete a schema and every readout made with it. galya-commerce-v3 cannot be deleted
            (400). Interactions are untouched. DELETE /v1/schemas/{schemaId} in...
          noindex: true
  /v1/search:
    post:
      x-galya-convenience-for: POST /v1/user with rank.query
      tags:
      - user
      operationId: searchWorkspace
      summary: Search the catalog by intent, ranked by taste
      description: 'Convenience for `POST /v1/user` with `rank.query`, without interactions. Items are

        retrieved by keyword match (case-insensitive, per term) on their title, text and metadata;

        items matching more of the query''s terms come first, and the user''s taste (when `user_id` is

        given) orders items of equal match strength. Matches without a readout yet are still

        returned, unscored, after the scored ones of the same strength. Same response shape as the

        `ranked` part of `/v1/user`. To rank by taste alone (no query), use `POST /v1/user` with `rank`.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              schema: galya-commerce-v3
              query: black boots for work
              user_id: shop_client_9f2c
              limit: 12
      responses:
        '200':
          description: Matching items, ranked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingOrInvalidApiKey'
      x-mint:
        metadata:
          description: Search the catalog by intent, ranked by taste. Convenience for POST /v1/user with
            rank.query, without interactions. Items are retrieved by keyword match...
          noindex: true
  /v1/recommend:
    post:
      x-galya-convenience-for: POST /v1/user with rank (no item_ids)
      tags:
      - user
      operationId: recommendForUser
      summary: Recommend from the whole catalog for a user, on the Galya model
      description: 'Convenience for `POST /v1/user` with `rank` and no `item_ids`: the top `limit` catalog
        items for

        this shopper''s taste. Every item with a readout is a candidate (no retrieval step); near-duplicates

        of items the shopper just interacted with are pushed down. Each result carries `score`,

        `contributions` (the readout fields that drove it) and a `reason`. `meta.state_source` says whether

        the taste came from cache or was computed for this call. Typical p95 is under 100 ms from a

        server in the same region with a kept-alive connection; `Server-Timing: worker;dur=…` reports
        the

        time spent in Galya.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
      x-mint:
        metadata:
          description: 'Recommend from the whole catalog for a user, on the Galya model. Convenience for
            POST /v1/user with rank and no itemids: the top limit catalog items for...'
          noindex: true
  /v1/rerank:
    post:
      x-galya-convenience-for: POST /v1/user with rank.item_ids
      tags:
      - user
      operationId: rerankForUser
      summary: Rerank your candidate items for a user, on the Galya model
      description: 'Convenience for `POST /v1/user` with `rank.item_ids`: put your own candidates (from
        your search,

        a collection page, a carousel) in this shopper''s taste order. Candidates without a readout yet
        are

        kept, unscored, after the ranked ones (and listed under `explain.dropped.no_readout`), so a rerank

        never loses your items. Each result carries `score` and `contributions` (the readout fields that

        drove it). `include_state: evidence` adds the shopper''s taste (`explain.user_state`): per field
        the

        top options with `p` and the catalog `prior`.


        Taste comes from the shopper''s interactions (`POST /v1/user`), read by the model under the

        schema''s fields; it is cached and refreshed in the background after new interactions

        (`meta.state_source`). Typical p95 is under 100 ms for 30 candidates from a server in the same

        region with a kept-alive connection.

        '
      security:
      - WorkspaceApiKey: []
      - WorkspaceBearer: []
      parameters:
      - $ref: '#/components/parameters/OptionalWorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
            examples:
              rerank:
                value:
                  user_id: shopper_1
                  candidate_ids:
                  - dress_a
                  - dress_b
                  - dress_c
              withTaste:
                summary: With the shopper's taste
                value:
                  user_id: shopper_1
                  candidate_ids:
                  - vid_1
                  - vid_2
                  - vid_3
                  include:
                  - metadata
                  include_state: evidence
      responses:
        '200':
          description: Reranked candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-mint:
        metadata:
          description: 'Rerank your candidate items for a user, on the Galya model. Convenience for POST
            /v1/user with rank.itemids: put your own candidates (from your search, a...'
          noindex: true
components:
  securitySchemes:
    WorkspaceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    WorkspaceBearer:
      type: http
      scheme: bearer
      description: Workspace API key (`galya_sk_...`) as Bearer token
  parameters:
    SchemaIdPath:
      name: schemaId
      in: path
      required: true
      schema:
        type: string
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
    OptionalWorkspaceHeader:
      name: X-Galya-Workspace-Id
      in: header
      required: false
      schema:
        type: string
      description: Must match the workspace that owns the API key when set
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    MissingOrInvalidApiKey:
      description: Missing or invalid workspace API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    WorkspaceMismatch:
      description: X-Galya-Workspace-Id does not match the key's workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: workspace_mismatch
            message: API key does not belong to this workspace
  schemas:
    ItemStatus:
      type: string
      enum:
      - pending
      - ready
      - failed
      description: '`pending`: queued for the model. `ready`: readout stored and current for the workspace
        schema.

        `failed`: the model could not read it (`error` says why); it does not rank until re-upserted.

        '
    Readout:
      type: object
      description: 'Field id -> option -> probability. Questions you write appear as `q:<id>`; `galya-commerce-v3`
        uses

        plain ids (`color`, `product_family`, …). When supplied on input, a single option string (`"Dress"`)

        or a `{option: p}` map is accepted per field and normalised.

        '
      additionalProperties:
        oneOf:
        - type: string
        - type: object
          additionalProperties:
            type: number
            minimum: 0
      example:
        color:
          Black: 0.82
          Navy: 0.12
          Grey: 0.06
        product_family:
          Dress: 0.97
          Skirt: 0.03
    SchemaRef:
      description: 'The schema a call reads items and taste through: a schema id (`galya-commerce-v3`,

        `sch_…`), or an inline `SchemaDefinition` from your code, which is stored and resolved to

        its content-addressed id (returned as `schema_id`).

        '
      oneOf:
      - type: string
        example: galya-commerce-v3
      - $ref: '#/components/schemas/SchemaDefinition'
    ItemReadout:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ItemStatus'
        readout:
          $ref: '#/components/schemas/Readout'
        readout_source:
          type: string
          description: '`supplied`, or the model that generated the readout.'
        error:
          type: string
        updated_at:
          type: string
          format: date-time
    ItemFields:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        text:
          type: string
          description: Description or listing text the model reads.
          maxLength: 20000
        image_url:
          type: string
          format: uri
          description: Primary image the model reads (https or a data URI).
        metadata:
          type: object
          additionalProperties: true
          description: 'Your fields, returned as-is and filterable with `metadata.<key>`. `product_id`
            groups

            variants for the same-product diversity penalty; `duration_s` enables relative dwell.

            '
    ItemInput:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
            description: Your id for the item (e.g. a Shopify product GID suffix).
          readout:
            $ref: '#/components/schemas/Readout'
      - $ref: '#/components/schemas/ItemFields'
    PutItemRequest:
      allOf:
      - type: object
        required:
        - schema
        properties:
          schema:
            $ref: '#/components/schemas/SchemaRef'
          readout:
            $ref: '#/components/schemas/Readout'
      - $ref: '#/components/schemas/ItemFields'
    ItemUpsertRequest:
      type: object
      required:
      - schema
      - items
      properties:
        schema:
          $ref: '#/components/schemas/SchemaRef'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ItemInput'
    ItemUpsertResponse:
      type: object
      required:
      - schema_id
      - items
      properties:
        schema_id:
          type: string
          description: The id the call's schema resolved to.
        job_id:
          type: string
          description: Not returned yet (readouts are queued per item); poll `GET /v1/item/{itemId}` or
            `GET /v1/item?status=pending`.
        items:
          type: array
          items:
            type: object
            required:
            - id
            - status
            properties:
              id:
                type: string
              status:
                $ref: '#/components/schemas/ItemStatus'
              error:
                type: string
    Item:
      allOf:
      - type: object
        required:
        - id
        - readouts
        - created_at
        - updated_at
        properties:
          id:
            type: string
          readouts:
            type: object
            description: Schema id -> this item's readout for that schema.
            additionalProperties:
              $ref: '#/components/schemas/ItemReadout'
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
      - $ref: '#/components/schemas/ItemFields'
    ItemPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        next_cursor:
          type:
          - string
          - 'null'
    ScreenPosition:
      type: object
      description: Where the item sat on screen, as fractions of the viewport (layout-agnostic).
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        area:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the viewport the item covered.
        index:
          type: integer
          minimum: 0
          description: Order the item came into view on this screen.
    InteractionContext:
      type: object
      properties:
        surface:
          type: string
          description: Where it happened, e.g. `collection`, `search`, `pdp`, `cart`, `email`, `feed`.
        screen_id:
          type: string
          description: Groups interactions and impressions shown together on one screen.
        query:
          type: string
          description: Search query or collection handle that produced the screen.
        session_id:
          type: string
        position:
          $ref: '#/components/schemas/ScreenPosition'
    Interaction:
      type: object
      required:
      - item_id
      - tag
      properties:
        id:
          type: string
          maxLength: 128
          description: Idempotency key. A repeated id is not counted twice.
        item_id:
          type: string
        tag:
          type: string
          maxLength: 200
          description: 'What happened, in plain language. Known signals: viewed / impression, liked,

            unliked, saved, unsaved, added to bag, bought, skipped. Other text is stored as-is

            and read as `other` (no weight) until the model learns it.

            '
          example: added to bag
        at:
          type: string
          format: date-time
          description: Defaults to the time Galya receives it.
        dwell_ms:
          type: integer
          minimum: 0
        context:
          $ref: '#/components/schemas/InteractionContext'
    SignalKind:
      type: string
      enum:
      - impression
      - view
      - like
      - unlike
      - save
      - unsave
      - add_to_bag
      - purchase
      - dwell
      - skip
      - other
    RankRequest:
      type: object
      properties:
        item_ids:
          type: array
          maxItems: 1000
          items:
            type: string
          description: Rerank exactly these. Omit to recommend from the catalog.
        query:
          type: string
          maxLength: 500
          description: 'Search intent ("black boots for work"). Items are retrieved by keyword match on
            their

            text and readout options, then ranked by taste. Same results as `POST /v1/search` for

            this user. Combine with `where` to narrow further.

            '
        where:
          type: string
          description: Readout / metadata filter (same grammar as `GET /v1/item`).
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        exclude_interacted:
          type: boolean
          default: false
          description: Drop items the user already bought or added to bag.
    UserRequest:
      type: object
      required:
      - user_id
      - schema
      properties:
        user_id:
          type: string
          maxLength: 128
          description: Your id for the shopper; an anonymous client id is fine.
        schema:
          $ref: '#/components/schemas/SchemaRef'
        merge_from:
          type: array
          items:
            type: string
          maxItems: 10
          description: Earlier (e.g. anonymous) user ids whose history moves into `user_id`.
        interactions:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Interaction'
        rank:
          $ref: '#/components/schemas/RankRequest'
        include:
          type: array
          items:
            type: string
            enum:
            - taste
            - item
          description: '`taste` adds the taste profile; `item` adds each ranked item''s title, image_url
            and metadata.'
    Reason:
      type: object
      required:
      - field
      - option
      - lift
      properties:
        field:
          type: string
        option:
          type: string
        lift:
          type: number
          description: Contribution of this field/option to the score.
    RankedItem:
      type: object
      required:
      - item_id
      - score
      - reasons
      properties:
        item_id:
          type: string
        score:
          type: number
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
        item:
          $ref: '#/components/schemas/Item'
    TasteField:
      type: object
      required:
      - field
      - top
      properties:
        field:
          type: string
        top:
          type: array
          items:
            type: object
            required:
            - option
            - p
            - lift
            properties:
              option:
                type: string
              p:
                type: number
              lift:
                type: number
                description: p relative to the catalog baseline (1 = no preference).
        evidence:
          type: number
          description: How much of the user's history speaks to this field.
    Taste:
      type: object
      required:
      - fields
      - evidence
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TasteField'
        evidence:
          type: number
          description: Total decayed interaction weight; 0 = cold start.
        summary:
          type: string
          description: The strongest preferences in one line, e.g. "Black, wrap silhouettes, midi length".
    UserResponse:
      type: object
      required:
      - user_id
      - schema_id
      - meta
      properties:
        user_id:
          type: string
        schema_id:
          type: string
        interactions:
          type: array
          items:
            type: object
            required:
            - item_id
            - tag
            - read_as
            - status
            properties:
              id:
                type: string
              item_id:
                type: string
              tag:
                type: string
              read_as:
                $ref: '#/components/schemas/SignalKind'
              status:
                type: string
                enum:
                - recorded
                - duplicate
                - item_pending
                - item_unknown
        ranked:
          type: array
          items:
            $ref: '#/components/schemas/RankedItem'
        not_ranked:
          type: array
          description: Requested ids that could not be scored, with why.
          items:
            type: object
            properties:
              item_id:
                type: string
              reason:
                type: string
                enum:
                - not_found
                - pending
                - failed
        taste:
          $ref: '#/components/schemas/Taste'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      required:
      - model_version
      - state_source
      properties:
        model_version:
          type: string
          description: Which release of the Galya model answered. Informational; there is nothing to select.
          example: galya-natural-language-commerce@2026-10
        state_source:
          type: string
          enum:
          - model
          - cache
          - pooled
          - cold_start
          description: 'Where the taste came from: the model, its cache, the pooled fallback, or none
            yet.'
        latency_ms:
          type: number
    SearchResponse:
      type: object
      required:
      - schema_id
      - ranked
      - meta
      properties:
        schema_id:
          type: string
        ranked:
          type: array
          items:
            $ref: '#/components/schemas/RankedItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UserProfile:
      type: object
      required:
      - user_id
      - schema_id
      - taste
      - interaction_count
      properties:
        user_id:
          type: string
        schema_id:
          type: string
        taste:
          $ref: '#/components/schemas/Taste'
        interaction_count:
          type: integer
        interactions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Interaction'
            - type: object
              properties:
                read_as:
                  $ref: '#/components/schemas/SignalKind'
        updated_at:
          type: string
          format: date-time
    TasteQuestion:
      type: object
      required:
      - id
      - text
      - options
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          description: The readout field is `q:<id>`.
        text:
          type: string
          maxLength: 500
        options:
          type: array
          minItems: 2
          maxItems: 24
          uniqueItems: true
          items:
            type: string
            maxLength: 200
    SchemaDefinition:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          description: Label for humans. Not part of the id.
        base:
          type:
          - string
          - 'null'
          default: galya-commerce-v3
          description: Another schema whose fields to include as well (e.g. `galya-commerce-v3`). `null`
            = only `questions`.
          example: galya-commerce-v3
        questions:
          type: array
          maxItems: 64
          description: The prompt — your questions, answered per item as fields `q:<id>`.
          items:
            $ref: '#/components/schemas/TasteQuestion'
    Schema:
      allOf:
      - $ref: '#/components/schemas/SchemaDefinition'
      - type: object
        required:
        - id
        - builtin
        - fields
        - created_at
        properties:
          id:
            type: string
            description: '`galya-commerce-v3`, or `sch_` + a hash of `base` and `questions`.'
            example: sch_9b1f2e7c4a
          builtin:
            type: boolean
          fields:
            type: integer
            description: Readout fields per item (base fields + questions).
          items:
            type: object
            description: How many items have a readout for this schema, by status.
            properties:
              ready:
                type: integer
              pending:
                type: integer
              failed:
                type: integer
          created_at:
            type: string
            format: date-time
    SchemaPage:
      type: object
      required:
      - schemas
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/Schema'
        next_cursor:
          type:
          - string
          - 'null'
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    SearchRequest:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          maxLength: 500
        schema:
          allOf:
          - $ref: '#/components/schemas/SchemaRef'
          description: Defaults to `galya-commerce-v3`.
        user_id:
          type: string
          description: Order matches of equal strength by this user's taste.
        where:
          type: string
          description: Readout / metadata filter (same grammar as `GET /v1/item`).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        include:
          type: array
          items:
            type: string
            enum:
            - item
          description: '`item` adds each result''s item card.'
    RecommendRequest:
      type: object
      additionalProperties: false
      required:
      - user_id
      properties:
        user_id:
          type: string
        include:
          type: array
          items:
            type: string
            enum:
            - metadata
            - contents
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    RerankRequest:
      type: object
      additionalProperties: false
      required:
      - user_id
      - candidate_ids
      properties:
        user_id:
          type: string
        candidate_ids:
          type: array
          minItems: 1
          items:
            type: string
        include:
          type: array
          items:
            type: string
            enum:
            - metadata
            - contents
          description: Adds each result's name, type, metadata and/or contents (pictures live on contents).
        include_state:
          type: string
          enum:
          - evidence
          - all
          default: evidence
          description: 'Readout-state models: which fields `explain.user_state` lists. `evidence`: fields
            the

            user''s signals carry evidence on; `all`: every field of the candidates'' readouts.

            '
    RerankResponse:
      type: object
      additionalProperties: true
      properties:
        compiled:
          type: object
          additionalProperties: true
        results:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
            - entity_id
            - score
            properties:
              entity_id:
                type: string
              score:
                type: number
              name:
                type:
                - string
                - 'null'
              type:
                type: string
              base:
                type: number
                description: Readout-state only. Score before the same-product penalty.
              penalty:
                type: number
                description: Readout-state only. Same-product penalty subtracted.
              contributions:
                type: array
                description: Readout-state only. Top per-field terms of the score.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    option:
                      type: string
                    lift:
                      type: number
              reason:
                type: string
                description: 'Readout-state only, e.g. `↑ matches liked: Black, Dress`, `↓ less of: Stripe`,
                  `exploring (cold start)`.'
              metadata:
                description: 'With `include: [metadata]`.'
              contents:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: 'With `include: [contents]`.'
        explain:
          type: object
          additionalProperties: true
          description: 'How the ranking was made: `ranked_by`, `state_source`, `state_fields` (fields
            the shopper''s

            taste covered), `user_state` (see `ReadoutUserState`, with `include_state`), `signals`, and

            `dropped: { not_found, no_readout }`.

            '
          properties:
            user_state:
              $ref: '#/components/schemas/ReadoutUserState'
        meta:
          type: object
          additionalProperties: true
          properties:
            latency_ms:
              type: number
            state_source:
              type: string
              enum:
              - model
              - cache
              - stale
              - fallback
              - pooled
              description: 'Readout-state only. `model`: fresh from the model server; `cache`: stored
                state for the

                same positive interactions; `fallback`: the lookup failed (timeout, error, not

                configured) and the pooled formula ranked; `pooled`: no positive signal yet.

                '
    ReadoutUserState:
      type: object
      description: 'Readout-state rerank: the user state S the ranking used (pooled signals × the model

        correction), per field the top 3 options with their probability `p` and the catalog prior

        `prior` (the candidates'' marginal). Values are rounded to 4 significant digits.

        '
      required:
      - fields
      - model_fields
      properties:
        fields:
          type: array
          items:
            type: object
            required:
            - id
            - top
            - model
            properties:
              id:
                type: string
                description: Field id, e.g. `color`
              top:
                type: array
                maxItems: 3
                items:
                  type: object
                  required:
                  - o
                  - p
                  - prior
                  properties:
                    o:
                      type: string
                    p:
                      type: number
                    prior:
                      type: number
              model:
                type: boolean
                description: The model correction applied on this field
        model_fields:
          type: array
          items:
            type: string
          description: Fields where the model correction applied.
      example:
        fields:
        - id: color
          top:
          - o: Black
            p: 0.62
            prior: 0.31
          - o: Red
            p: 0.17
            prior: 0.2
          - o: White
            p: 0.09
            prior: 0.18
          model: true
        model_fields:
        - color

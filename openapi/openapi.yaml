  /v1/entity/{parentId}/link:
    post:
      tags: [core]
      operationId: linkEntity
      summary: Link a child entity to a parent and refresh user state
      description: |
        Creates the parent user entity if missing. Requires the child entity to exist.
        Does not re-encode the child. Recomposes the parent's state vector from its
        linked children using the latent model (`model_id`, a decoder). When `model_id`
        is omitted, the workspace compose default is used, falling back to weighted-mean-v1.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: parentId
          in: path
          required: true
          schema:
            type: string
          description: Parent entity public id (often a user id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkEntityRequest"
      responses:
        "200":
          description: Link recorded and state composition attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkEntityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "404":
          description: Child entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
      x-codeSamples:
        - lang: typescript
          label: linkEntity
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.linkEntity({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                parentId: "<id>",
                body: {
                  metadata: {
                    dwell_ms: 8200,
                    duration_s: 21,
                    at: 1793340000000,
                  },
                },
              });

              console.log(result);
            }

            run();
  /v1/entity/{parentId}/link/{childId}:
    delete:
      tags: [core]
      operationId: unlinkEntity
      summary: Remove a child link from a parent and refresh user state
      description: |
        Deletes the parent→child link. With `relation`, only that relation is removed;
        otherwise every relation between the two entities is removed. The parent's state
        vector is then recomposed from its remaining links using the latent model
        (`model_id`, a decoder; defaults as for `linkEntity`). When no links remain, the
        parent's state vectors are deleted from every vector index and `state.status` is
        `cleared`. Neither entity is deleted.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: parentId
          in: path
          required: true
          schema:
            type: string
          description: Parent entity public id (often a user id)
        - name: childId
          in: path
          required: true
          schema:
            type: string
          description: Linked child entity public id
        - name: relation
          in: query
          required: false
          schema:
            type: string
          description: Only remove this relation. Omit to remove all relations.
        - name: model_id
          in: query
          required: false
          schema:
            type: string
          description: Decoder used to recompose the parent state
        - name: encoder_model_id
          in: query
          required: false
          schema:
            type: string
          description: Encoder index to write the recomposed state into
      responses:
        "200":
          description: Link removed and state recomposed (or cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkEntityResponse"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "404":
          description: Parent, child, latent model, or link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
      x-codeSamples:
        - lang: typescript
          label: unlinkEntity
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.unlinkEntity({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {
                parentId: "<id>",
                childId: "<id>",
              });


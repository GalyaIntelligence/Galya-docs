      responses:
        '200':
          description: Connector instance
      x-codeSamples:
      - lang: typescript
        label: getConnector
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya({\n\
          \  workspaceApiKey: process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n});\n\nasync function\
          \ run() {\n  await galya.connectors.getConnector({\n    connectorId: \"45bcd83e-f01d-4895-992a-463538114f8d\"\
          ,\n  });\n\n\n}\n\nrun();"
      x-mint:
        metadata:
          description: Get workspace connector instance. GET /v1/connectors/{connectorId} in the Galya
            API reference.
          noindex: true
    patch:
      tags:
      - connectors
      operationId: updateConnector
      summary: Update connector instance
      security:
      - WorkspaceApiKey: []
      parameters:
      - name: connectorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated
      x-codeSamples:
      - lang: typescript
        label: updateConnector
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya({\n\
          \  workspaceApiKey: process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n});\n\nasync function\
          \ run() {\n  await galya.connectors.updateConnector({\n    connectorId: \"5cd2fc9f-09d5-4f4c-84cf-d6596cb3048a\"\
          ,\n  });\n\n\n}\n\nrun();"

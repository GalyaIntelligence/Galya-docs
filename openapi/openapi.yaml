      x-codeSamples:
      - lang: typescript
        label: createConnector
        source: "import { Galya } from \"@galya-intelligence/galya-api\";\n\nconst galya = new Galya({\n\
          \  workspaceApiKey: process.env[\"GALYA_WORKSPACE_API_KEY\"] ?? \"\",\n});\n\nasync function\
          \ run() {\n  await galya.connectors.createConnector();\n\n\n}\n\nrun();"
      x-mint:
        metadata:
          description: Connect a native integration. POST /v1/connectors in the Galya API reference.
          noindex: true
  /v1/connectors/{connectorId}:
    get:
      tags:
      - connectors
      operationId: getConnector
      summary: Get workspace connector instance

  /v1/visualize:
    get:
      tags: [core]
      operationId: visualize
      summary: Entities with relative positions from the vector index
      description: |
        One call that returns everything needed to draw the workspace: its entities,
        each entity's relative position computed server-side from the vector stored in
        the vector index (classical MDS on cosine distance between the folded content
        vectors, scaled to the unit sphere, so on-screen distance tracks index distance),
        nearest-neighbour similarity edges by cosine, and the stored links between the
        returned entities. Entities with nothing indexed yet have `position: null` and
        `embedded: false`. Intended for the dashboard explorer; raw vectors are never
        sent to the client.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: model_id
          in: query
          required: false
          schema:
            type: string
          description: Encoder public id. Defaults to the platform encoder.
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Only entities of this type
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Only entities in this domain
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
          description: Most recently updated entities to include
        - name: neighbors
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 3
          description: Nearest neighbours per embedded entity to emit as `edges`; 0 disables
        - name: min_similarity
          in: query
          required: false
          schema:
            type: number
            minimum: -1
            maximum: 1
            default: 0.15
          description: Drop neighbour edges below this cosine similarity
        - name: include_links
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include stored links between the returned entities
      responses:
        "200":
          description: Visualization scene
          content:
            application/json:
              schema:
                type: object
                required: [model_id, dimensions, layout, nodes, edges, links, stats]
                properties:
                  model_id:
                    type: string
                  dimensions:
                    type: integer
                  layout:
                    type: object
                    required: [method, dims, scale]
                    properties:
                      method:
                        type: string
                        enum: [mds_cosine]
                      dims:
                        type: integer
                      scale:
                        type: string
                        enum: [unit_sphere]
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [id, type, domain, name, embedded, position]
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        domain:
                          type: [string, "null"]
                        name:
                          type: [string, "null"]
                        embedded:
                          type: boolean
                          description: Whether the vector index holds a vector for this entity
                        position:
                          type: [array, "null"]
                          description: "[x, y, z] in the unit sphere; null when not embedded"
                          items:
                            type: number
                          minItems: 3
                          maxItems: 3
                  edges:
                    type: array
                    description: Nearest-neighbour edges by cosine similarity, high to low
                    items:
                      type: object
                      required: [source, target, similarity]
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        similarity:
                          type: number
                  links:
                    type: array
                    description: Stored links whose parent and child are both in `nodes`
                    items:
                      type: object
                      required: [source, target, relation, weight]
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        relation:
                          type: string
                        weight:
                          type: number
                  stats:
                    type: object
                    required: [entity_count, embedded_count, edge_count, link_count, truncated]
                    properties:
                      entity_count:
                        type: integer
                      embedded_count:
                        type: integer
                      edge_count:
                        type: integer
                      link_count:
                        type: integer
                      truncated:
                        type: boolean
                        description: More entities exist than `limit`
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "404":
          description: Encoder model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
      x-codeSamples:
        - lang: typescript
          label: visualize
          source: |-
            import { Galya } from "@galya-intelligence/galya-api";

            const galya = new Galya();

            async function run() {
              const result = await galya.core.visualize({
                workspaceApiKey: process.env["GALYA_WORKSPACE_API_KEY"] ?? "",
              }, {});

              console.log(result);
            }

            run();
  /v1/concepts:
    get:
      tags: [core]
      operationId: getConcepts
      summary: Concept map for a domain
      description: |
        Returns concepts (topics, themes, or aesthetics) as 2D concept-space
        regions. Centroids come from UMAP/PCA of stored concept embeddings for
        the requested encoder; Voronoi polygons tile the unit square. Concept
        vectors are persisted in Postgres and mirrored to a dedicated Turbopuffer
        namespace per domain and encoder for filtered nearest-neighbor search.
      security:
        - WorkspaceApiKey: []
        - WorkspaceBearer: []
      parameters:
        - $ref: "#/components/parameters/OptionalWorkspaceHeader"
        - name: domain
          in: query
          required: false
          schema:
            type: string
            default: fashion
        - name: model_id
          in: query
          required: false
          schema:
            type: string
            default: grwm-jepa-1
          description: Encoder or ranker whose concept space layout is shown.
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [topics, themes, aesthetics]
            default: aesthetics
      responses:
        "200":
          description: Concept map
          content:
            application/json:
              schema:
                type: object
                required: [domain, model_id, level, extent, items]
                properties:
                  domain:
                    type: string
                  model_id:
                    type: string
                  level:
                    type: string
                  extent:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  layout_source:
                    type: string
                    enum: [embedding]
                  turbopuffer_namespace:
                    type: string
                    description: Per-domain concept centroid index for ANN queries.
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, blurb, level, centroid, polygon]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        blurb:
                          type: string
                        level:
                          type: string
                        parent_id:
                          type: string
                          nullable: true
                        child_ids:
                          type: array
                          items:
                            type: string
                        volume:
                          type: number
                        centroid:
                          type: object
                          properties:
                            x:
                              type: number
                            y:
                              type: number
                        polygon:
                          type: array
                          items:
                            type: object
                            properties:
                              x:
                                type: number
                              y:
                                type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/MissingOrInvalidApiKey"
        "403":
          $ref: "#/components/responses/WorkspaceMismatch"
        "404":
          description: Domain catalog not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
      x-codeSamples:
